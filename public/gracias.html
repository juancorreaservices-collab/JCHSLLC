<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment received</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fa;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#15171a;padding:24px}
  main{background:#fff;border:1px solid #e1e4e9;border-radius:16px;padding:36px 28px;max-width:420px;text-align:center}
  .ok{width:56px;height:56px;border-radius:50%;background:#e6f6ec;color:#1b8a4b;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0;color:#4a5059;line-height:1.5}
  @media (prefers-color-scheme:dark){body{background:#0b1b33;color:#e9eef7}main{background:#0f2443;border-color:#2a3e5f}p{color:#a9b8d0}}
</style>
</head>
<body>
<main>
  <div class="ok" aria-hidden="true">&#10003;</div>
  <h1>Payment received</h1>
  <p>Thank you! Your payment was processed. A receipt was sent to your email. You can close this page.</p>
</main>
</body>
</html>
