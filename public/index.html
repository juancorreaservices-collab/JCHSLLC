  </div>
  <section class="card"><div class="pad" style="padding-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="font-size:17px">Profit and loss by month</h3><span class="bar-legend" style="margin:0"><span><span class="sw" style="background:var(--ok)"></span>Income</span><span><span class="sw" style="background:var(--bad)"></span>Expenses</span></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="n">Income</th><th class="n">Expenses</th><th class="n">Profit</th><th style="width:28%"></th></tr></thead>
    <tbody>${months.map(m=>{const xs=inY.filter(t=>monthOf(t.date)===m); const i=sum(xs,'in'), o=sum(xs,'out'); return `<tr><td>${MES[+m.slice(5)-1]}</td><td class="n">${i?fmt(i):'—'}</td><td class="n">${o?fmt(o):'—'}</td><td class="n"><b style="color:${i-o<0?'var(--bad)':'inherit'}">${i||o?fmt(i-o):'—'}</b></td><td><div style="display:flex;flex-direction:column;gap:3px">${bar(i,'ok')}${bar(o,'bad')}</div></td></tr>`}).join('')}</tbody>
    <tfoot><tr><td>Total ${year}</td><td class="n">${fmt(inc)}</td><td class="n">${fmt(exp)}</td><td class="n">${fmt(net)}</td><td></td></tr></tfoot></table></div>
    ${undated.length?`<div class="pad" style="padding-top:8px"><div class="note warn">${undated.length} undated transaction${undated.length===1?'':'s'} ${undated.length===1?'does':'do'} not appear in this report (${fmt(sum(undated,'in'))} in income, ${fmt(sum(undated,'out'))} in expenses). Add a date in Services or in the project.</div></div>`:''}
  </section>
  <div class="grid g2">
    <section class="card"><div class="pad" style="padding-bottom:6px"><h3 style="font-size:17px">Expenses by category</h3></div>
      ${catRows.length?`<div class="tbl-wrap"><table><tbody>${catRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${fmt(v)}</td><td class="n muted">${pct(v/exp)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>No expenses this year.</span></div>'}
    </section>
    <section class="card"><div class="pad" style="padding-bottom:6px"><h3 style="font-size:17px">Subcontractors (1099-NEC)</h3><p class="muted" style="margin:4px 0 0;font-size:12px">Anyone you paid ${fmt(th)} or more during the year usually needs a 1099-NEC. Confirm the amount and requirements with your accountant.</p></div>
      ${subRows.length?`<div class="tbl-wrap"><table><tbody>${subRows.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${fmt(v)}</td><td>${v>=th?'<span class="pill warn">Needs 1099</span>':'<span class="pill">Below threshold</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>No subcontractor payments this year.</span></div>'}
    </section>
  </div>`}`;
}
async function exportLedger(){
  const year = S.repYear || String(new Date().getFullYear());
  const rows = [['Date','Type','Category','Who','Detail','Amount']];
  ledger().filter(t=>String(t.date).startsWith(year)||!t.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>rows.push([t.date||'No date', t.kind==='in'?'Income':'Expense', t.cat, t.who, t.note, (t.kind==='in'?1:-1)*t.amount]));
  const csv = rows.map(r=>r.map(v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  if (!S.dl){ toast('Download is not available in this view'); return; }
  try { await S.dl.save({filename:`JCHS-movimientos-${year}.csv`, data:'﻿'+csv}); } catch(e){ if (!['cancelled','declined'].includes(e?.code)) toast('Could not download the file'); }
}
$('#view').addEventListener('change', e => {

  if (e.target.id==='expCat'){ S.expCat = e.target.value; renderView(); }

});

async function exportCSV(){
  const rows = [['Month','Project','Type','Client/Owner','Location','Start','End','Status','Price','Down payment','Total collected','Balance due','Purchases','Subcontratistas','Net profit','Margin']];
  list('projects').sort((a,b)=>(a.month||'').localeCompare(b.month||'')).forEach(p=>{const c=pc(p); rows.push([monthLabel(p.month),p.name,p.type,clientName(p.clientId)||p.owner,p.location,p.start,p.end,p.status,c.price,c.down,c.cobrado,c.falta,c.compras,c.subCost,c.ganancia,pct(c.margen)]);});
  rows.push([]); rows.push(['Service','Client','Date','Status','Collected','Profit','Notes']);
  list('services').forEach(s=>rows.push([s.name,s.client,s.date,s.status,N(s.charged),N(s.profit),s.notes]));
  const csv = rows.map(r=>r.map(v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  if (!S.dl){ toast('Download is not available in this view'); return; }
  try { await S.dl.save({filename:`JCHS-proyectos-${todayISO()}.csv`, data:'﻿'+csv}); } catch(e){ if (e?.code!=='cancelled' && e?.code!=='declined') toast('Could not download the file'); }
}
