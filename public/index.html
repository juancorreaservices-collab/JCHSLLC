async function shrinkImage(file){
  if (!file.type.startsWith('image/') || file.type==='image/svg+xml') return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));
  } catch(_){ return file; }
}
$('#drawer').addEventListener('change', async ev => {
  if (ev.target.id!=='receiptIn') return;
  const f = ev.target.files?.[0]; const o = cur(); if (!f || !o || !S.assets) return;
  const msg = $('#recMsg'); msg.innerHTML = '<div class="note">Subiendo recibo…</div>';
  try {
    const blob = await shrinkImage(f);
    const r = await S.assets.upload(blob, blob.type ? undefined : {type:'image/jpeg'});
    const old = o.receiptId;
    o.receiptId = r.id; o.receiptType = r.contentType || blob.type; persist('expenses', o, true); renderDrawer(); toast('Recibo guardado');
    if (old) S.assets.delete(old).catch(()=>{});
  } catch(e){
    const m = {quota_or_state:'No hay espacio para más archivos. Quita recibos viejos.', too_large:'El archivo es muy grande.', unsupported_type:'Ese tipo de archivo no se puede subir. Usa una foto (JPG/PNG) o un PDF.', invalid_request:'Ese archivo no se pudo leer. Prueba con otra foto.', not_granted:'No tienes permiso para subir archivos aquí.', rate_limited:'Espera unos segundos y vuelve a intentar.'}[e?.code];
    msg.innerHTML = `<div class="note bad">${esc(m || 'No se pudo subir el recibo. Intenta otra vez.')}</div>`;
  }
});

/* ---------- Reportes (P&L, categories, 1099) ---------- */
const fallbackDate = (d, month) => d || (month ? month+'-01' : '');
function ledger(){
  const tx = [];
  const ps = list('projects');
  const validProj = id => !!S.projects[id];
  ps.forEach(p => {
    if (N(p.down)) tx.push({date: fallbackDate(p.downDate||p.start, p.month), kind:'in', cat:'Proyectos', amount:N(p.down), who:p.name, note:'Down payment'});
    (p.payments||[]).forEach(x => { if (N(x.amount)) tx.push({date: fallbackDate(x.date, p.month), kind:'in', cat:'Proyectos', amount:N(x.amount), who:p.name, note:x.note||'Pago'}); });
    (p.purchases||[]).forEach(x => { if (N(x.amount)) tx.push({date: fallbackDate(x.date, p.month), kind:'out', cat:'Materiales', amount:N(x.amount), who:x.store||'', note:`${x.item||'Compra'} · ${p.name}`}); });
    (p.subs||[]).forEach(x => { if (N(x.paid)) tx.push({date: fallbackDate(x.date, p.month), kind:'out', cat:'Subcontratistas', amount:N(x.paid), who:x.name||'Sin nombre', note:`${x.work||''} · ${p.name}`}); });
  });
  list('invoices').forEach(inv => { if (validProj(inv.projectId)) return; (inv.payments||[]).forEach(x => { if (N(x.amount)) tx.push({date:x.date||inv.date, kind:'in', cat:'Facturas', amount:N(x.amount), who:clientName(inv.clientId), note:inv.number}); }); });
  list('services').forEach(s => {
    if (N(s.charged)) tx.push({date:s.date||'', kind:'in', cat:'Servicios', amount:N(s.charged), who:s.client||'', note:s.name});
    const cost = N(s.charged) - N(s.profit);
    if (N(s.charged) && N(s.profit) && cost>0) tx.push({date:s.date||'', kind:'out', cat:'Materiales', amount:cost, who:s.client||'', note:`Costo · ${s.name}`});
  });
  list('expenses').forEach(e => { if (N(e.amount)) tx.push({date:e.date, kind:'out', cat:e.category||'Otros', amount:N(e.amount), who:e.vendor||'', note:[e.desc, S.projects[e.projectId]?.name].filter(Boolean).join(' · ')}); });
  return tx;
}
function vReports(){
  const year = S.repYear || String(new Date().getFullYear());
  const tx = ledger();
  const years = [...new Set(tx.map(t=>String(t.date).slice(0,4)).filter(Boolean).concat([String(new Date().getFullYear())]))].sort().reverse();
  const inY = tx.filter(t=>String(t.date).startsWith(year)); const undated = tx.filter(t=>!t.date);
  const sum = (xs,k) => xs.filter(t=>t.kind===k).reduce((a,t)=>a+t.amount,0);
  const inc = sum(inY,'in'), exp = sum(inY,'out'), net = inc-exp;
  const months = Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  const maxM = Math.max(1, ...months.map(m=>Math.max(sum(inY.filter(t=>monthOf(t.date)===m),'in'), sum(inY.filter(t=>monthOf(t.date)===m),'out'))));
  const cats = {}; inY.filter(t=>t.kind==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
  const catRows = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const subs = {}; inY.filter(t=>t.kind==='out' && t.cat==='Subcontratistas').forEach(t=>{ const k=(t.who||'Sin nombre').trim(); subs[k]=(subs[k]||0)+t.amount; });
  const th = N(S.settings.threshold1099)||2000;
  const subRows = Object.entries(subs).sort((a,b)=>b[1]-a[1]);
  const bar = (v,cls) => `<div style="height:6px;border-radius:3px;background:var(--${cls});width:${Math.max(0,Math.min(100,v/maxM*100))}%;min-width:${v?2:0}px"></div>`;
  return `
  <div class="head"><div><h1>Reportes</h1><p>Ganancias y pérdidas según el dinero que entró y salió (base de efectivo).</p></div>
    <div class="tools"><label class="f"><span hidden>Año</span><select class="in plain" id="repYear">${years.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></label>
    <button class="btn" data-act="export-ledger">${I.dl} Exportar movimientos (CSV)</button></div></div>
  ${loading()? loadingBlock('tus reportes') : `
  <div class="grid g3">
    <div class="card tile"><span class="label">Ingresos ${year}</span><strong class="num">${fmt(inc)}</strong><small>Down payments, pagos, facturas y servicios</small></div>
    <div class="card tile"><span class="label">Gastos ${year}</span><strong class="num">${fmt(exp)}</strong><small>Compras, subcontratistas y gastos del negocio</small></div>
    <div class="card tile ${net<0?'alert':''}"><span class="label">Ganancia neta ${year}</span><strong class="num">${fmt(net)}</strong><small>${inc?`Margen ${pct(net/inc)}`:'Sin ingresos todavía'}</small></div>
  </div>
  <section class="card"><div class="pad" style="padding-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h3 style="font-size:17px">Ganancias y pérdidas por mes</h3><span class="bar-legend" style="margin:0"><span><span class="sw" style="background:var(--ok)"></span>Ingresos</span><span><span class="sw" style="background:var(--bad)"></span>Gastos</span></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Gastos</th><th class="n">Ganancia</th><th style="width:28%"></th></tr></thead>
    <tbody>${months.map(m=>{const xs=inY.filter(t=>monthOf(t.date)===m); const i=sum(xs,'in'), o=sum(xs,'out'); return `<tr><td>${MES[+m.slice(5)-1]}</td><td class="n">${i?fmt(i):'—'}</td><td class="n">${o?fmt(o):'—'}</td><td class="n"><b style="color:${i-o<0?'var(--bad)':'inherit'}">${i||o?fmt(i-o):'—'}</b></td><td><div style="display:flex;flex-direction:column;gap:3px">${bar(i,'ok')}${bar(o,'bad')}</div></td></tr>`}).join('')}</tbody>
    <tfoot><tr><td>Total ${year}</td><td class="n">${fmt(inc)}</td><td class="n">${fmt(exp)}</td><td class="n">${fmt(net)}</td><td></td></tr></tfoot></table></div>
    ${undated.length?`<div class="pad" style="padding-top:8px"><div class="note warn">${undated.length} movimiento${undated.length===1?'':'s'} sin fecha no ${undated.length===1?'aparece':'aparecen'} en este reporte (${fmt(sum(undated,'in'))} de ingresos, ${fmt(sum(undated,'out'))} de gastos). Ponles fecha en Servicios o en el proyecto.</div></div>`:''}
  </section>
  <div class="grid g2">
    <section class="card"><div class="pad" style="padding-bottom:6px"><h3 style="font-size:17px">Gastos por categoría</h3></div>
      ${catRows.length?`<div class="tbl-wrap"><table><tbody>${catRows.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${fmt(v)}</td><td class="n muted">${pct(v/exp)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>Sin gastos en este año.</span></div>'}
    </section>
    <section class="card"><div class="pad" style="padding-bottom:6px"><h3 style="font-size:17px">Subcontratistas (1099-NEC)</h3><p class="muted" style="margin:4px 0 0;font-size:12px">A quien le pagaste ${fmt(th)} o más en el año normalmente necesita un 1099-NEC. Confirma el monto y los requisitos con tu contador.</p></div>
      ${subRows.length?`<div class="tbl-wrap"><table><tbody>${subRows.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${fmt(v)}</td><td>${v>=th?'<span class="pill warn">Necesita 1099</span>':'<span class="pill">Menos del mínimo</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><span>Sin pagos a subcontratistas este año.</span></div>'}
    </section>
  </div>`}`;
}
async function exportLedger(){
  const year = S.repYear || String(new Date().getFullYear());
  const rows = [['Fecha','Tipo','Categoría','Quién','Detalle','Monto']];
  ledger().filter(t=>String(t.date).startsWith(year)||!t.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(t=>rows.push([t.date||'Sin fecha', t.kind==='in'?'Ingreso':'Gasto', t.cat, t.who, t.note, (t.kind==='in'?1:-1)*t.amount]));
  const csv = rows.map(r=>r.map(v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  if (!S.dl){ toast('La descarga no está disponible en esta vista'); return; }
  try { await S.dl.save({filename:`JCHS-movimientos-${year}.csv`, data:'﻿'+csv}); } catch(e){ if (!['cancelled','declined'].includes(e?.code)) toast('No se pudo descargar el archivo'); }
}

async function exportCSV(){
  const rows = [['Mes','Proyecto','Tipo','Cliente/Owner','Ubicación','Inicio','Fin','Estado','Costo','Down','Total cobrado','Falta cobrar','Compras','Subcontratistas','Ganancia neta','Margen']];

  rows.push([]); rows.push(['Servicio','Cliente','Fecha','Estado','Cobrado','Ganancia','Notas']);
  list('services').forEach(s=>rows.push([s.name,s.client,s.date,s.status,N(s.charged),N(s.profit),s.notes]));
  const csv = rows.map(r=>r.map(v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  if (!S.dl){ toast('La descarga no está disponible en esta vista'); return; }
  try { await S.dl.save({filename:`JCHS-proyectos-${todayISO()}.csv`, data:'﻿'+csv}); } catch(e){ if (e?.code!=='cancelled' && e?.code!=='declined') toast('No se pudo descargar el archivo'); }
}
