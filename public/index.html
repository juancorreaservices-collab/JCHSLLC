<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuadra</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuadra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/runtime.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed sidebar (desktop) / bottom tab bar (phone) + scrolling workspace; documents open in a right-hand drawer.
   Yellow-tinted inputs echo the "celdas amarillas = editar" convention from the Proyectos spreadsheet. */
:root{
  /* KUADRA: deep navy (Krontrol) · electric blue (Krecimiento) · ice blue + white (Klaridad) */
  --navy:#0B1B33; --electric:#1F5EFF; --ice:#DCEBFF; --silver:#C9D1DB;
  --k-stem:#0B1B33; --k-arm:#1F5EFF; --k-leg:#0B1B33;
  --ink:#0B1B33; --ink-2:#44536B; --ink-3:#7887A0;
  --paper:#ffffff; --surface:#ffffff; --surface-2:#EDF2F8; --line:#DFE6EF;
  --accent:#1F5EFF; --accent-ink:#ffffff; --accent-soft:#E6EEFF;
  --head-bg:#0B1B33; --head-ink:#ffffff;
  --edit:#fff8dc; --edit-line:#eedc9a;
  --ok:#1e7a4c; --ok-soft:#dff3e8; --warn:#9a6200; --warn-soft:#fdf0d5;
  --bad:#b4372f; --bad-soft:#fbe3e1; --info:#245ea8; --info-soft:#e1ecfa; --mute-soft:#eceef1;
  --logo-filter:none;
  --f-display:"Manrope","Inter","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,22,25,.06),0 4px 14px rgba(20,22,25,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0B1B33; --electric:#5B9BFF; --ice:#DCEBFF; --silver:#8E9AAD;
  --k-stem:#FFFFFF; --k-arm:#5B9BFF; --k-leg:#DCEBFF;
  --ink:#EAF0F8; --ink-2:#B3C0D3; --ink-3:#7F8DA3;
  --paper:#070F1E; --surface:#0E1A2E; --surface-2:#15233A; --line:#22324B;
  --accent:#6AA3FF; --accent-ink:#06101F; --accent-soft:#16284A;
  --head-bg:#15233A; --head-ink:#EAF0F8;
  --edit:#2a2618; --edit-line:#5a4f27;
  --ok:#5fcf95; --ok-soft:#173326; --warn:#e8b55a; --warn-soft:#352914;
  --bad:#f08a80; --bad-soft:#3a1d1b; --info:#8db8f0; --info-soft:#1a2a40; --mute-soft:#262a30;
  --logo-filter:invert(1) brightness(1.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0B1B33; --electric:#5B9BFF; --ice:#DCEBFF; --silver:#8E9AAD;
  --k-stem:#FFFFFF; --k-arm:#5B9BFF; --k-leg:#DCEBFF;
  --ink:#EAF0F8; --ink-2:#B3C0D3; --ink-3:#7F8DA3;
  --paper:#070F1E; --surface:#0E1A2E; --surface-2:#15233A; --line:#22324B;
  --accent:#6AA3FF; --accent-ink:#06101F; --accent-soft:#16284A;
  --head-bg:#15233A; --head-ink:#EAF0F8;
  --edit:#2a2618; --edit-line:#5a4f27;
  --ok:#5fcf95; --ok-soft:#173326; --warn:#e8b55a; --warn-soft:#352914;
  --bad:#f08a80; --bad-soft:#3a1d1b; --info:#8db8f0; --info-soft:#1a2a40; --mute-soft:#262a30;
  --logo-filter:invert(1) brightness(1.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.money{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 6px 4px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:1px}
.wordmark i{font-style:normal;color:var(--accent)}
.biz{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.biz img{width:46px;filter:var(--logo-filter)}
.biz small{color:var(--ink-3);font-size:11px;line-height:1.3}
.biz b{display:block;color:var(--ink-2);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 6px}
.dbstate{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}

main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:28px;font-weight:800}
.head p{margin:2px 0 0;color:var(--ink-3)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--ink-3);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}

/* Goal */
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:860px){.goal{grid-template-columns:minmax(0,1fr)}}
.goal .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.05}
.goal .of{color:var(--ink-3);font-weight:500;font-size:18px}
.bar{position:relative;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.25;border-radius:99px}
.bar-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:0}
.sw.lt{opacity:.3}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv strong{font-family:var(--f-display);font-size:20px;font-weight:700}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile strong{font-family:var(--f-display);font-size:24px;font-weight:700}
.tile small{color:var(--ink-3)}
.tile.alert strong{color:var(--bad)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{color:var(--ink);font-size:16px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Board */
.board-nav{display:flex;align-items:center;gap:6px}
.board-nav strong{font-family:var(--f-display);min-width:190px;text-align:center}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px;border:2px dashed transparent;transition:border-color .12s,background .12s}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col.now .col-h h3::after{content:"Este mes";margin-left:8px;font-family:var(--f-body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;vertical-align:3px}
.col-h{display:flex;flex-direction:column;gap:6px;padding:2px 4px 6px}
.col-h h3{font-size:17px;font-weight:800}
.col-sum{display:flex;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.col-sum b{color:var(--ink);font-weight:600}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:grab;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--ink-3)}
.pcard.dragging{opacity:.4}
.pcard h4{font-size:15px;font-weight:700;line-height:1.25}
.pcard .meta{font-size:12px;color:var(--ink-3)}
.pcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:9px}
.pcard .figs div{display:flex;flex-direction:column}
.pcard .figs span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.pcard .figs b{font-size:13px;font-variant-numeric:tabular-nums}
.pcard .mover{display:none}
@media (pointer:coarse){.pcard .mover{display:block}.pcard{cursor:pointer}}
.add-in-col{border:1px dashed var(--ink-3);background:none;border-radius:8px;padding:9px;color:var(--ink-3);cursor:pointer;font-weight:600}
.add-in-col:hover{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Forms */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--ink-2);font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--edit-line);background:var(--edit);border-radius:7px;padding:8px 10px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.plain{background:var(--surface);border-color:var(--line)}
textarea.in{resize:vertical;min-height:80px}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{padding-left:32px;width:220px;max-width:100%}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.legend-edit{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.legend-edit i{width:14px;height:10px;border-radius:2px;background:var(--edit);border:1px solid var(--edit-line)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dr-h .title-in{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;font-weight:800;border:1px solid transparent;background:none;padding:4px 6px;border-radius:6px}
.dr-h .title-in:hover{border-color:var(--line)}
.dr-h .title-in:focus{border-color:var(--accent);outline:none;background:var(--edit)}
.dr-b{flex:1;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:16px}
.dr-b > *{flex-shrink:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stats b.neg{color:var(--bad)} .stats b.pos{color:var(--ok)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rows{display:flex;flex-direction:column;gap:8px}
.rowline{display:grid;gap:8px;align-items:center}
.rowline.hdr{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.r-pay{grid-template-columns:130px 120px minmax(0,1fr) 30px}
.r-buy{grid-template-columns:130px minmax(0,1.4fr) minmax(0,1fr) 110px 30px}
.r-sub{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) 95px 95px 130px 80px 30px}
.r-task{grid-template-columns:minmax(0,1fr) 140px minmax(0,.8fr) 30px}
.r-item{grid-template-columns:minmax(0,1fr) 70px 110px 110px 30px}
.r-eitem{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr) 56px 100px 96px 30px}
.r-ipay{grid-template-columns:130px 120px minmax(0,1fr) 30px}
.calc{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-right:4px}
@media (max-width:640px){
  .rowline.hdr{display:none}
  .rowline{grid-template-columns:repeat(2,minmax(0,1fr))!important;background:var(--surface-2);padding:8px;border-radius:8px}
  .rowline > :first-child{grid-column:1/-1}
  .rowline .icon-btn{justify-self:end}
}
.totline{display:flex;justify-content:flex-end;gap:18px;font-size:13px;flex-wrap:wrap}
.totline b{font-variant-numeric:tabular-nums}
.dr-actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-weight:600;flex-wrap:wrap}

/* AI assistant box */
.btn[hidden],.aibox [hidden]{display:none!important}
.aibox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai-badge{font-weight:600;color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ai-h small{color:var(--ink-3);font-size:13px}
.aibox textarea{min-height:76px;background:var(--surface)}
.ai-partial{font-size:13px;color:var(--ink-3);font-style:italic;min-height:0}
.ai-partial:empty{display:none}
.ai-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qs{display:flex;flex-direction:column;gap:12px}
.qs-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.qs-2{grid-template-columns:1fr}}
.qs-chips{display:flex;flex-wrap:wrap;gap:6px}
.qs-sug{display:flex;flex-direction:column;margin-top:-8px}
.qs-sug:empty{display:none}
.qs-sug button{display:flex;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 4px;text-align:left;cursor:pointer;color:var(--ink);font-size:13px}
.qs-sug button:hover{background:var(--surface)}
.qs-sug b{font-variant-numeric:tabular-nums;white-space:nowrap}
.qs-keep{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.qs-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
.qs-h h3{margin:0;font-size:14px}
.notes-mic{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.notes-mic .dictp{flex:1;min-width:0}
.micbtn.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.replies{display:flex;flex-direction:column;gap:10px;padding:16px}
.reply{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

function pc(p){
  const price = N(p.price), down = N(p.down);
  const extra = (p.payments||[]).reduce((a,x)=>a+N(x.amount),0);
  const cobrado = down + extra;
  // receipts saved in Gastos and linked to this project count here too
  const linked = Object.values(S.expenses).filter(e=>e.projectId===p.id);
  const lSub = linked.filter(e=>e.category==='Subcontratistas').reduce((a,x)=>a+N(x.amount),0);
  const lBuy = linked.filter(e=>e.category!=='Subcontratistas').reduce((a,x)=>a+N(x.amount),0);
  const compras = (p.purchases||[]).reduce((a,x)=>a+N(x.amount),0) + lBuy;
  const subCost = (p.subs||[]).reduce((a,x)=>a+N(x.cost),0) + lSub;
  const subPaid = (p.subs||[]).reduce((a,x)=>a+N(x.paid),0) + lSub;
  const supHours = (p.hours||[]).reduce((a,x)=>a+N(x.hours),0), supCost = Math.round(supHours*N(p.supRate)*100)/100;
  const gastos = compras + subCost + supCost;
  const ganancia = price === 0 ? N(p.profitNote) : price - gastos;
  const tasks = (p.tasks||[]).filter(t=>t.text);
  const progress = p.status==='Completado' ? 1 : (tasks.length ? tasks.filter(t=>t.status==='Completado').length/tasks.length : 0);
  return { price, down, extra, cobrado, falta: price - cobrado, pctCobrado: price>0 ? cobrado/price : 0,
    compras, subCost, subPaid, subFalta: subCost-subPaid, supHours, supCost, gastos, ganancia, margen: price>0 ? ganancia/price : 0,
    efectivo: cobrado - compras - subPaid, progress };
}

function docCols(d, coll){
  const dflt = coll==='invoices' ? (d.showPrices ? '' : '1') : '1';
  return { qty: !(d.hideQty ?? dflt), price: !(d.hidePrice ?? dflt), amount: !(d.hideAmount ?? dflt) };
}
function docTotals(d){
  const base = (d.items||[]).reduce((a,x)=>a+N(x.qty||1)*N(x.rate),0);
  // optional profit markup (e.g. 15%) applied to the whole total; item prices are never shown on estimates
  const disc = d.showDisc ? Math.min(base, d.discType==='%' ? base*N(d.discount)/100 : N(d.discount)) : 0;
  const net = base - disc;
  const mk = d.useMarkup ? net * N(d.markup)/100 : 0;
  const sub = net + mk;
  const tax = sub * N(d.taxRate)/100;
  const total = Math.round((sub + tax)*100)/100;
  const paid = (d.payments||[]).reduce((a,x)=>a+N(x.amount),0);
  const dep = d.showDep ? Math.round((d.depType==='$' ? N(d.deposit) : total*N(d.deposit)/100)*100)/100 : 0;
  return { base, disc, mk, sub, tax, total, paid, dep, balance: total - paid };
}

const TR = {'Borrador':'Draft','Enviado':'Sent','Enviada':'Sent','Aceptado':'Accepted','Rechazado':'Not accepted','No aceptado':'Not accepted','Convertido':'Converted','Vencido':'Expired','Vencida':'Overdue','Pagada':'Paid','Pago parcial':'Partially paid',
  'Completado':'Completed','En progreso':'In progress','Incompleto':'Incomplete','No comenzado':'Not started','Pendiente':'Pending',
  'Materiales':'Materials','Subcontratistas':'Subcontractors','Gasolina y vehículo':'Gas and vehicle','Herramientas y equipo':'Tools and equipment','Renta de equipo':'Equipment rental','Seguro':'Insurance','Teléfono e internet':'Phone and internet','Publicidad':'Advertising','Licencias y permisos':'Licenses and permits','Comisiones de pago':'Payment fees','Oficina y software':'Office and software','Comidas':'Meals','Otros':'Other',
  'Tarjeta del negocio':'Business card','Efectivo':'Cash','Cheque':'Check','Transferencia':'Bank transfer','Tarjeta personal':'Personal card','Tarjeta':'Card','Todas':'All','Todos':'All','Facturas':'Invoices','Servicios':'Services'};
const tr = x => TR[x] || x;
function trNode(n){
  if (n.nodeType===3){ const t = n.nodeValue, k = t.trim(); if (k && TR[k] && !n.parentElement?.closest('input,textarea,[data-notr],.paper,.doc-paper .dp-notes')){ const el = n.parentElement; if (el?.tagName==='OPTION' && !el.hasAttribute('value')) el.setAttribute('value', k); n.nodeValue = t.replace(k, TR[k]); } return; }
  if (n.nodeType!==1 || n.tagName==='SCRIPT' || n.tagName==='STYLE') return;
  const w = document.createTreeWalker(n, NodeFilter.SHOW_TEXT); const list = []; while (w.nextNode()) list.push(w.currentNode); list.forEach(trNode);
}
new MutationObserver(ms => ms.forEach(m => { if (m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(trNode); })).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
const statusPill = (s, map) => `<span class="pill ${map[s]??''}">${esc(s||'—')}</span>`;

/* ---------- Persistence ---------- */
/* Every change is first written to a small queue on this device, then sent to the cloud.
   If the connection drops or the page closes mid-save, the queue survives and is sent again later. */
const saveTimers = {};
const OB_KEY = 'kuadra.outbox.v1';
const OB = { q:{}, recent:{}, busy:new Set(), err:false, n:0, warned:0 };
try { OB.q = JSON.parse(localStorage.getItem(OB_KEY) || '{}') || {}; } catch(_){ OB.q = {}; }
function obStore(){ try { localStorage.setItem(OB_KEY, JSON.stringify(OB.q)); } catch(_){} obStatus(); }
function obStatus(){
  if (!S.db) return; const n = Object.keys(OB.q).length;
  if (!n){ if (S.live) setDb('on','Saved to the cloud'); return; }
  if (OB.err || navigator.onLine===false) setDb('off', `${n} change${n===1?'':'s'} waiting for connection`); else setDb('on','Saving…');
}
function obQueue(key, op){ op.at = Date.now()+'.'+(++OB.n); OB.q[key] = op; obStore(); }
async function obSend(key){
  const op = OB.q[key]; if (!op || !S.db || OB.busy.has(key)) return; OB.busy.add(key); const at = op.at;
  try {
    if (op.t==='del') await S.db.collection(op.coll).doc(op.id).delete();
    else if (op.t==='doc') await S.db.doc(op.path).set(op.body);
    else await S.db.collection(op.coll).doc(op.id).set(op.body);
    if (OB.q[key] && OB.q[key].at===at){ delete OB.q[key]; OB.recent[key] = {op, until: Date.now()+15000}; }
    OB.err = false;
  } catch(e){ OB.err = true; if (Date.now()-OB.warned > 60000){ OB.warned = Date.now(); handleDbErr(e); } }
  OB.busy.delete(key); obStore();
  if (OB.q[key] && OB.q[key].at!==at) obSend(key);
}
function obFlush(){ Object.keys(saveTimers).forEach(k=>{ clearTimeout(saveTimers[k]); delete saveTimers[k]; }); Object.keys(OB.q).forEach(obSend); }
// what is still waiting to be sent wins over what the cloud sends back, so nothing "un-types" itself
function obOverlay(c, next){ const now = Date.now(); for (const k of Object.keys(OB.recent)) if (OB.recent[k].until < now || OB.q[k]) delete OB.recent[k];
  for (const op of [...Object.values(OB.recent).map(r=>r.op), ...Object.values(OB.q)]){ if (op.coll!==c) continue; if (op.t==='del') delete next[op.id]; else if (op.t==='set') next[op.id] = {id:op.id, ...structuredClone(op.body)}; } }
window.addEventListener('online', obFlush);
window.addEventListener('offline', obStatus);
window.addEventListener('pagehide', () => { draftStore(); obFlush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='hidden'){ draftStore(); obFlush(); } else if (Object.keys(OB.q).length) obFlush(); });
setInterval(() => { if (Object.keys(OB.q).length) obFlush(); }, 20000);

/* The estimate / invoice being edited is kept on this device until it is saved, so closing the page does not lose it */
const DRAFT_KEY = 'kuadra.draft.v1'; let draftTimer = null;
function draftStore(){
  clearTimeout(draftTimer);
  try { const D = S.doc; if (D && D.mode==='edit' && D.dirty && D.draft) localStorage.setItem(DRAFT_KEY, JSON.stringify({coll:D.coll, id:D.id, isNew:!!D.isNew, draft:D.draft, at:new Date().toISOString()})); else localStorage.removeItem(DRAFT_KEY); } catch(_){}
}
function draftTouch(){ clearTimeout(draftTimer); draftTimer = setTimeout(draftStore, 600); }
function draftOffer(){
  if (draftOffer.done) return; draftOffer.done = true;
  let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch(_){}
  if (!d || !d.draft || (S.doc && S.doc.mode==='edit')) return;
  if (!d.isNew && !S[d.coll]?.[d.id]){ try { localStorage.removeItem(DRAFT_KEY); } catch(_){} return; }
  S.draftFound = d; const isInv = d.coll==='invoices';
  openModal('Unsaved work found', `<p>You were editing ${isInv?'an invoice':'an estimate'}${d.draft.number?` (<b>${esc(d.draft.number)}</b>)`:''}${clientName(d.draft.clientId)?` for <b>${esc(clientName(d.draft.clientId))}</b>`:''} on this device and it was not saved. Last change: ${fdate(d.at)}.</p>`, `<button class="btn" data-act="draft-drop">Discard it</button><button class="btn primary" data-act="draft-restore">Continue editing</button>`);
}
function persist(coll, obj, immediate){
  if (S.doc && S.doc.mode==='edit' && obj === S.doc.draft){ S.doc.dirty = true; draftTouch(); return; }
  if (coll==='items' && obj._chunk){ S.items[obj.id] = obj; persistChunk(obj._chunk); return; }
  S[coll][obj.id] = obj;
  const { id, ...body } = obj;
  body.updatedAt = new Date().toISOString();
  const key = coll+'/'+obj.id;
  obQueue(key, {t:'set', coll, id, body: JSON.parse(JSON.stringify(body))});
  clearTimeout(saveTimers[key]);
  if (immediate) return obSend(key);
  saveTimers[key] = setTimeout(() => obSend(key), 500);
}
async function remove(coll, id){
  if (coll==='items' && S.items[id]?._chunk){ const ch = S.items[id]._chunk; delete S.items[id]; persistChunk(ch); return; }
  delete S[coll][id];
  const key = coll+'/'+id; clearTimeout(saveTimers[key]); obQueue(key, {t:'del', coll, id}); return obSend(key);
}
async function saveSettings(){
  obQueue('settings/main', {t:'doc', path:'settings/main', body: JSON.parse(JSON.stringify(S.settings))});
  clearTimeout(saveTimers.settings);
  saveTimers.settings = setTimeout(() => obSend('settings/main'), 500);
}
function handleDbErr(e){
  const m = {quota_exceeded:'The database is full. Delete old records to keep saving.', invalid_argument:'You do not have permission to save changes in this app.', revoked:'Access to the data was lost. Reload the page.', resource_exhausted:'Too many changes in a row. Wait a few seconds.'}[e?.code];
  toast(m || 'Could not save. Check your connection.');
}
async function nextNumber(kind){
  const pre = kind==='inv' ? 'invPrefix' : 'estPrefix', nx = kind==='inv' ? 'invNext' : 'estNext';
  const n = N(S.settings[nx]) || 1001;
  S.settings[nx] = n + 1; saveSettings();
  return (S.settings[pre]||'') + n;
}

/* ---------- Boot ---------- */
function setDb(state, txt){
  for (const [d,t] of [['#dbdot','#dbtxt'],['#dbdot2','#dbtxt2']]) { const el=$(d); if(el){ el.className='dot '+state; $(t).textContent=txt; } }
}
async function boot(){
  render();
  const claude = window.claude;
  if (!claude?.use){ offline(); return; }
  const loadTimer = setTimeout(()=>{ if(!S.live){ setDb('off','No connection'); $('#banner').innerHTML='<div class="banner">Your data has not loaded yet. Check your connection; the app keeps trying.</div>'; } }, 10000);
  claude.use('db').then(db => {
    if (!db){ clearTimeout(loadTimer); offline(); return; }
    S.db = db; obFlush();
    for (const c of COLL){
      db.collection(c).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = {id:d.id, ...structuredClone(d.data())}; });
        if (c==='items') Object.values(S.items).forEach(x => { if (x._chunk) next[x.id] = x; });
        // keep unsaved local edits for the doc open in the drawer
        if (S.drawer && S.drawer.coll===c && next[S.drawer.id]) next[S.drawer.id] = S[c][S.drawer.id] || next[S.drawer.id];
        obOverlay(c, next);
        if (c==='views' && S.loaded.views) for (const [id,v] of Object.entries(next)){ const o = S.views[id] || {}; if ((v.count||0) > (o.count||0) || (v.payClicks||0) > (o.payClicks||0)){ const d = S[v.coll]?.[id]; if (d) toast(`${clientName(d.clientId)||'The client'} ${(v.payClicks||0) > (o.payClicks||0) ? 'opened the payment page for' : 'viewed'} ${v.coll==='invoices'?'invoice':'estimate'} ${d.number}`); } }
        S[c] = next; S.loaded[c] = !snap.metadata.fromCache || S.loaded[c]; if (c==='estimates') setTimeout(watchReplies, 0); if (c==='estimates' || c==='invoices' || c==='clients') checkApprovals();
        if (!snap.metadata.fromCache){ S.live = true; clearTimeout(loadTimer); obStatus(); $('#banner').innerHTML=''; if (COLL.every(k=>S.loaded[k])) setTimeout(draftOffer, 600); if (S.remindFromLink && S.loaded.invoices && S.loaded.clients){ S.remindFromLink = false; setTimeout(remindersModal, 400); } }
        renderView();
      }, e => { setDb('off','Data error'); clearTimeout(loadTimer); $('#banner').innerHTML = `<div class="banner">Could not load the data (${esc(e.code)}). Reload the page.</div>`; });
    }
    db.collection('catalog').onSnapshot(snap => {
      Object.keys(S.items).forEach(k => { if (S.items[k]._chunk) delete S.items[k]; });
      snap.docs.forEach(d => { (d.data().items||[]).forEach(it => { S.items[it.id] = {...structuredClone(it), _chunk: d.id}; }); });
      if (S.view==='productos') renderView();
    }, ()=>{});
    db.doc('settings/main').onSnapshot(s => { if (s.exists) S.settings = {...DEFAULT_SETTINGS, ...structuredClone(s.data()), ...(OB.q['settings/main'] ? structuredClone(OB.q['settings/main'].body) : {})}; S.loaded.settings=true; if(S.view==='ajustes' && document.activeElement?.closest?.('#view')) return; renderView(); }, ()=>{});
  });
  claude.use('mcp').then(m => { S.mcp = m; if (S.view==='email') renderView(); watchReplies(); });
  claude.use('downloads').then(d => { S.dl = d; });
  Promise.resolve().then(()=>claude.standalone ? claude.use('commas') : null).then(c => { S.commas = c || null; if (c){ checkCommasPayments(); setInterval(checkCommasPayments, 300000); if (S.view==='doc') renderDocNow(); } }).catch(()=>{});
  aiInit();
  claude.use('assets').then(a => { S.assets = a; if (S.drawer?.coll==='expenses') renderDrawer(); });
}
function offline(){
  setDb('off','Not saving');
  $('#banner').innerHTML = '<div class="banner">This view cannot save data. Open Kuadra from your account to view and save your projects.</div>';
  COLL.forEach(c=>S.loaded[c]=true); renderView();
}

const VIEWS = [
  ['panel','Dashboard',I.panel,''],['proyectos','Projects',I.board,''],['estimados','Estimates',I.est,''],['facturas','Invoices',I.inv,''],['servicios','Services',I.tool,''],['calendario','Calendar',I.cal,''],
  ['clientes','Clients',I.users,'more'],['productos','Products & services',I.tag,'more'],
  ['gastos','Expenses',I.wallet,'more'],['reportes','Reports',I.chart,'more'],
  ['email','Email',I.mail,'more'],['ajustes','Settings',I.gear,'more']
];
function render(){
  const overdue = list('invoices').filter(i=>invStatus(i)[0]==='Vencida').length;
  const curNav = S.view==='doc' && S.doc ? (S.doc.coll==='invoices'?'facturas':'estimados') : S.view;
  const btn = ([k,l,ic]) => `<button data-go="${k}" ${curNav===k?'aria-current="page"':''}>${ic}<span>${l}</span>${k==='facturas'&&overdue?`<span class="badge">${overdue}</span>`:''}</button>`;

}
document.addEventListener('toggle', e => { if (e.target.matches?.('.nav-more')) { try { localStorage.setItem('kuadra.more', e.target.open?'1':'0'); } catch(_){} } }, true);
function moreMenu(){
  openModal('More', `<div class="more-grid">${VIEWS.filter(v=>v[3]==='more'||v[0]==='calendario').map(([k,l,ic])=>`<button class="more-item" data-go="${k}">${ic}<span>${l}</span></button>`).join('')}</div>`, '');
}
function go(v){
  if (S.view==='doc' && S.doc?.mode==='edit' && S.doc.dirty && !S.forceGo){
    S.pendingGo = v;
    openModal('Unsaved changes', `<p>You have unsaved changes in this ${docLabel(S.doc.coll)}. What would you like to do?</p>`, `<button class="btn" data-act="modal-close">Keep editing</button><button class="btn danger" data-act="go-discard">Leave without saving</button><button class="btn primary" data-act="go-save">Save</button>`);
    return;
  }
  S.forceGo = false; S.doc = null; draftStore(); if (!$('#modal').hidden) closeModal();
  S.view = v; try{ history.replaceState(null,'','#'+v); }catch(e){} render(); window.scrollTo(0,0);
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if (VIEWS.some(v=>v[0]===h) && h!==S.view){ S.view=h; render(); } });

function renderView(){
  const v = $('#view'); if (!v) return;
  const fn = {panel:vPanel, proyectos:vProjects, estimados:()=>vDocs('estimates'), facturas:()=>vDocs('invoices'), gastos:vExpenses, productos:vCatalog, doc:vDocPage, reportes:vReports, clientes:vClients, servicios:vServices, email:vEmail, ajustes:vSettings, calendario:vCalendar}[S.view] || vPanel;
  // don't clobber a field the user is typing in on inline-edit views
  const ae = document.activeElement;
  if (ae && v.contains(ae) && ae.matches('[data-svc],[data-set],[data-item],[data-k]')) return;
  v.innerHTML = fn();
  if (S.view==='proyectos' && S.projTab==='mes') wireBoard();
  if (S.view==='email') loadMail();
}
const loading = () => !COLL.every(c=>S.loaded[c]);

/* ---------- Panel ---------- */
function vPanel(){
  const st = S.settings, ps = list('projects');
  const svc = list('services');
  const qst = quickStats();
  const svcProfit = svc.reduce((a,s)=>a+N(s.profit),0) + qst.profit;
  const done = ps.filter(p=>p.status==='Completado').reduce((a,p)=>a+pc(p).ganancia,0) + svcProfit;
  const projected = ps.reduce((a,p)=>a+pc(p).ganancia,0) + svcProfit;
  const goal = N(st.goalAmount)||1;
  const cobrado = ps.reduce((a,p)=>a+pc(p).cobrado,0) + svc.reduce((a,s)=>a+N(s.charged),0) + qst.charged;
  const porCobrar = ps.reduce((a,p)=>a+Math.max(0,pc(p).falta),0);
  const invs = list('invoices'); const venc = invs.filter(i=>invStatus(i)[0]==='Vencida');
  const ests = list('estimates').filter(e=>estStatus(e)[0]==='Enviado');

  const active = ps.filter(p=>p.status!=='Completado').length;
  const rows = ps.slice().sort((a,b)=>(a.month||'').localeCompare(b.month||'') || (a.order||0)-(b.order||0));
  const payments = [];
  ps.forEach(p => { if (N(p.down)) payments.push({date:p.downDate||p.start||'', amount:p.down, who:p.name, note:'Down payment'}); (p.payments||[]).forEach(x=>payments.push({date:x.date, amount:x.amount, who:p.name, note:x.note||'Payment'})); });
  svc.forEach(s=>{ if(N(s.charged)) payments.push({date:s.date||'', amount:s.charged, who:s.name+' · '+(s.client||''), note:'Service'}); });

  ${loading()? loadingBlock('your numbers') : `

function wireBoard(){
  const b = $('#board'); const q = $('#boardq');
  if (q) q.oninput = e => { S.boardQ = e.target.value; const pos = e.target.selectionStart; renderView(); const n=$('#boardq'); n.focus(); n.setSelectionRange(pos,pos); };
  if (!b) return;
  let dragId = null;
  b.addEventListener('dragstart', e => { const c = e.target.closest('.pcard'); if(!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', dragId);}catch(_){} });
  b.addEventListener('dragend', e => { e.target.closest?.('.pcard')?.classList.remove('dragging'); b.querySelectorAll('.col.drop').forEach(c=>c.classList.remove('drop')); });
  b.addEventListener('dragover', e => { const col = e.target.closest('.col'); if(!col) return; e.preventDefault(); b.querySelectorAll('.col.drop').forEach(c=>c!==col&&c.classList.remove('drop')); col.classList.add('drop'); });
  b.addEventListener('drop', e => { const col = e.target.closest('.col'); if(!col||!dragId) return; e.preventDefault(); moveProject(dragId, col.dataset.month, e.target.closest('.pcard')?.dataset.id); dragId=null; });
  b.addEventListener('change', e => { const s = e.target.closest('[data-move]'); if (s) moveProject(s.dataset.move, s.value); });
}
function moveProject(id, month, beforeId){
  const p = S.projects[id]; if(!p) return;
  const inCol = list('projects').filter(x=>x.month===month && x.id!==id).sort((a,b)=>(a.order||0)-(b.order||0));
  let order;
  if (beforeId && beforeId!==id){ const i = inCol.findIndex(x=>x.id===beforeId); const prev = inCol[i-1]; order = prev ? ((prev.order||0)+(inCol[i].order||0))/2 : (inCol[i].order||0)-1; }
  else order = inCol.length ? (inCol[inCol.length-1].order||0)+1 : 1;
  const changed = p.month!==month;
  p.month = month; p.order = order;
  persist('projects', p, true); renderView();
  if (changed) toast(`Moved to ${monthLabel(month)}`);
}

function linkify(t){ const urls = String(t||'').match(/https?:\/\/[^\s)]+/g); return urls ? `<div class="dr-actions">${urls.map(u=>`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${I.link} Open link</a>`).join('')}</div>` : ''; }

const PAY_METHODS_IN = ['Commas','Zelle','Cheque','Efectivo','Transferencia','Tarjeta'];
const addrL3 = c => c.city ? [c.city, [c.state, c.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ') : (c.zip ? [c.state, c.zip].filter(Boolean).join(' ') : '');
function fullAddr(c, sep='<br>'){ if(!c) return ''; const l3=addrL3(c); return [c.address, c.address2, l3].filter(Boolean).map(esc).join(sep); }
function plainAddr(c){ if(!c) return ''; const l3=addrL3(c); return [c.address, c.address2, l3].filter(Boolean).join(', '); }
function estStatus(e){
  if (e.convertedTo && S.invoices[e.convertedTo]) return ['Convertido','ok'];
  if (e.status==='Aceptado') return ['Aceptado','ok'];
  if (e.status==='Rechazado') return ['No aceptado','bad'];
  if (e.validUntil && e.validUntil < todayISO()) return ['Vencido','bad'];
  if (e.status==='Enviado' || e.sentAt) return ['Enviado','info'];
  return ['Borrador',''];
}

function docTotLine(d){

}

function convertEstimate(e, quiet){
  // copy every line; fold only the markup into each price, keep the discount as its own line (like Wave)
  const t = docTotals(e); const f = e.useMarkup ? 1 + N(e.markup)/100 : 1;
  const items = (e.items||[]).filter(r=>(r.desc||'').trim()||N(r.rate)).map(r=>({area:r.area||'', desc:r.desc||'', qty:r.qty||1, rate: Math.round(N(r.rate)*f*100)/100}));
  const diff = Math.round((t.base*f - items.reduce((a,r)=>a+N(r.qty||1)*N(r.rate),0))*100)/100;
  if (diff && items.length){ const last = items[items.length-1]; last.rate = Math.round((N(last.rate) + diff/N(last.qty||1))*100)/100; }
  return newDoc('invoices', {clientId:e.clientId, projectId:e.projectId, property:e.property, summary:e.summary||'', items, taxRate:e.taxRate, showTax:e.showTax||'', fromEstimate:e.id, plan:(e.plan||[]).map(({label,when,kind,value,date})=>({label,when,kind,value,date:date||''})), showDisc:e.showDisc||'', discType:e.discType||'$', discLabel:e.discLabel||'', discount: e.showDisc ? (e.discType==='%' ? e.discount : Math.round(N(e.discount)*f*100)/100) : '', showPrices:'', hideQty:docCols(e,'estimates').qty?'':'1', hidePrice:docCols(e,'estimates').price?'':'1', hideAmount:docCols(e,'estimates').amount?'':'1', notes:S.settings.invTerms}, true, quiet).then(inv => {

  });
}

/* Invoice payments mirror into the linked project's "Pagos recibidos" */
function syncInvoicePayments(inv){
  const p = S.projects[inv.projectId]; if (!p) return;
  p.payments = (p.payments||[]).filter(x=>x.invoiceId!==inv.id);
  (inv.payments||[]).forEach(x=>{ if (N(x.amount)) p.payments.push({date:x.date, amount:x.amount, note:`${inv.number}${x.method?' · '+x.method:''}`, invoiceId:inv.id}); });
  persist('projects', p, true);
}

async function fileBlob(f){

// PDF -> {text, images}: typed text is extracted; scanned / handwritten pages are rendered as images
async function parsePdf(blob, maxImgs){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
  const out = {text:'', images:[], pages: pdf.numPages};
  for (let i=1; i<=Math.min(pdf.numPages, 15); i++){
    const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
    const t = tc.items.map(x=>x.str + (x.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').trim();
    if (t.length > 60) out.text += `\n--- page ${i} ---\n${t}`;
    else if (out.images.length < maxImgs){
      const v1 = pg.getViewport({scale:1}); const sc = Math.min(2, 1600/Math.max(v1.width, v1.height)); const vp = pg.getViewport({scale: sc});
      const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext: ctx, viewport: vp}).promise;
      out.images.push({blob: await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)), page: i});
    }
  }
  out.text = out.text.slice(0, 40000);
  return out;
}
async function aiGatherDocs(d, st){
  const fs = docFiles(d); if (!fs.length) return {images:[], desc:''};
  let maxImgs = 8; try { const L = await AI.sample.limits?.(); if (L?.images?.maxCount) maxImgs = L.images.maxCount; else if (L && !L.images) maxImgs = 0; } catch(_){}
  const images = []; const parts = [];
  for (const f of fs){
    if (st) st.textContent = `Reading ${f.name}…`;
    try {
      const blob = await fileBlob(f);
      if (f.type==='application/pdf'){
        const pp = AI.parsed[f.id] ||= await parsePdf(blob, maxImgs);
        const imgs = pp.images.slice(0, Math.max(0, maxImgs - images.length));
        imgs.forEach(x => { images.push(x.blob); parts.push(`Image ${images.length}: "${f.name}", page ${x.page} (scanned page)`); });
        if (pp.text) parts.push(`Text extracted from PDF "${f.name}" (${pp.pages} pages):${pp.text}`);
      } else if (images.length < maxImgs){ images.push(blob); parts.push(`Image ${images.length}: "${f.name}"`); }
      else parts.push(`("${f.name}" could not be included: too many images)`);
    } catch(e){ parts.push(`("${f.name}" could not be read)`); }
  }
  return {images, desc: parts.join('\n\n')};
}

/* One look for every dropdown: selects and suggestion lists open the same white panel as the property picker */
const DD = {el:null, anchor:null, items:[], i:-1, kind:''};
function ddEl(){ if (!DD.el){ DD.el = document.createElement('div'); DD.el.id = 'dd'; DD.el.className = 'combo-pop dd'; DD.el.hidden = true; document.body.appendChild(DD.el); } return DD.el; }
function ddClose(){ if (DD.el) DD.el.hidden = true; DD.anchor = null; }
function ddPlace(){
  const a = DD.anchor, el = DD.el; if (!a || !el) return; const r = a.getBoundingClientRect();
  if (r.width===0 && r.height===0) return ddClose();
  const w = Math.min(window.innerWidth-16, Math.max(r.width, 220)); el.style.width = w+'px';
  el.style.left = Math.max(8, Math.min(r.left, window.innerWidth-w-8))+'px';
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12; const up = below < 180 && above > below;
  const list = el.querySelector('.combo-list'); if (list) list.style.maxHeight = Math.max(120, Math.min(300, (up?above:below) - (el.querySelector('.dd-q')?54:0) - 16))+'px';
  if (up){ el.style.top = ''; el.style.bottom = (window.innerHeight - r.top + 6)+'px'; } else { el.style.bottom = ''; el.style.top = (r.bottom + 6)+'px'; }
}
function ddRender(q){
  const el = ddEl(); q = (q||'').toLowerCase().trim();
  let hits = q ? DD.items.filter(x=>(x.label+' '+(x.hint||'')).toLowerCase().includes(q)) : DD.items; const more = hits.length - 60; hits = hits.slice(0,60);
  DD.hits = hits; DD.i = -1;
  const list = el.querySelector('.combo-list');
  list.innerHTML = hits.map((x,i)=>`<button type="button" class="combo-it ${x.on?'on':''}" data-i="${i}"><span class="dd-l">${esc(x.label)}</span>${x.hint?`<span class="dd-hint">${esc(x.hint)}</span>`:''}${x.on?`<span class="dd-ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>`:''}</button>`).join('') + (more>0?`<div class="combo-none">and ${more} more. Type to search.</div>`:'') || '<div class="combo-none">No matches.</div>';
  if (!hits.length && DD.kind==='list') return ddClose();
  ddPlace(); list.querySelector('.combo-it.on')?.scrollIntoView({block:'nearest'});
}
function ddOpen(anchor, items, kind){
  const el = ddEl(); DD.anchor = anchor; DD.items = items; DD.kind = kind;
  el.innerHTML = `${kind==='select' && items.length>8 ? `<div class="dd-q">${I.search}<input type="text" placeholder="Search" autocomplete="off"></div>`:''}<div class="combo-list"></div>`;
  el.hidden = false; ddRender(kind==='list' ? anchor.value : '');
  const qi = el.querySelector('.dd-q input'); if (qi){ qi.oninput = () => ddRender(qi.value); if (!matchMedia('(pointer:coarse)').matches) qi.focus(); }
}
function ddPick(x){
  const a = DD.anchor; if (!a || !x) return; ddClose();
  a.value = x.v; a.dispatchEvent(new Event('input', {bubbles:true})); a.dispatchEvent(new Event('change', {bubbles:true})); if (a.tagName==='SELECT') a.focus();
}
function ddSelect(sel){ if (sel.disabled || sel.multiple) return; if (DD.anchor===sel) return ddClose(); ddOpen(sel, [...sel.options].filter(o=>!o.disabled||o.selected).map(o=>({v:o.value, label:o.textContent.trim(), on:o.selected})), 'select'); }
function ddList(inp){
  let id = inp.getAttribute('list'); if (id){ inp.dataset.dd = id; inp.removeAttribute('list'); inp.setAttribute('autocomplete','off'); } else id = inp.dataset.dd;
  const dl = id && document.getElementById(id); if (!dl) return;
  const items = [...dl.options].map(o=>({v:o.value, label:o.value, hint:o.textContent.trim()!==o.value?o.textContent.trim():''})).filter(x=>x.v);
  if (!items.length) return; ddOpen(inp, items, 'list');
}
const ddIsList = t => t?.matches?.('input') && (t.getAttribute('list') || t.dataset.dd) && !t.closest('.combo');
document.addEventListener('mousedown', e => {
  if (e.target.closest?.('#dd')){ const it = e.target.closest('.combo-it'); if (it){ e.preventDefault(); ddPick(DD.hits[+it.dataset.i]); } else if (!e.target.closest('.dd-q')) e.preventDefault(); return; }
  const sel = e.target.closest?.('select'); if (sel && !sel.multiple){ e.preventDefault(); sel.focus(); return ddSelect(sel); }
  if (DD.anchor && e.target!==DD.anchor) ddClose();
}, true);
document.addEventListener('touchend', e => { const sel = e.target.closest?.('select'); if (sel && !sel.multiple && !sel.disabled){ e.preventDefault(); sel.focus(); ddSelect(sel); } }, {capture:true, passive:false});
document.addEventListener('focusin', e => { if (ddIsList(e.target)) ddList(e.target); });
document.addEventListener('input', e => { if (e.isTrusted && ddIsList(e.target)) ddList(e.target); });
document.addEventListener('focusout', e => { if (DD.anchor===e.target) setTimeout(()=>{ if (DD.anchor===e.target && !DD.el.contains(document.activeElement)) ddClose(); }, 150); });
document.addEventListener('keydown', e => {
  const t = e.target; const inDD = t.closest?.('#dd'); const isSel = t.tagName==='SELECT' && !t.multiple;
  if (!inDD && !isSel && !(DD.anchor===t)) return;
  const open = DD.el && !DD.el.hidden;
  if (isSel && !open){ if ([' ','Enter','ArrowDown','ArrowUp'].includes(e.key)){ e.preventDefault(); ddSelect(t); } return; }
  if (!open) return;
  const its = [...DD.el.querySelectorAll('.combo-it')];
  if (e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); const a = DD.anchor; ddClose(); a?.focus?.(); return; }
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if (DD.i<0) DD.i = its.findIndex(x=>x.classList.contains('on')); DD.i = Math.max(0, Math.min(its.length-1, DD.i + (e.key==='ArrowDown'?1:-1))); its.forEach((x,i)=>x.classList.toggle('kb', i===DD.i)); its[DD.i]?.scrollIntoView({block:'nearest'}); return; }
  if (e.key==='Enter' && DD.i>=0){ e.preventDefault(); e.stopPropagation(); return ddPick(DD.hits[DD.i]); }
  if (e.key==='Tab') ddClose();
}, true);
window.addEventListener('resize', ddClose);
document.addEventListener('scroll', e => { if (DD.anchor && !(e.target.closest?.('#dd'))) ddPlace(); }, true);
/* A client can own many properties: list them, search them, pick one */
function clientProps(c){ if (!c) return []; const seen = new Set(), out = []; [jobAddr(c), ...(c.properties||[])].forEach(x=>{ const v=String(x||'').trim(); const k=v.toLowerCase(); if (v && !seen.has(k)){ seen.add(k); out.push(v); } }); return out; }
function rememberProp(clientId, prop){ const c = S.clients[clientId]; prop = String(prop||'').trim(); if (!c || !prop) return; if (clientProps(c).some(x=>x.toLowerCase()===prop.toLowerCase())) return; (c.properties ||= []).push(prop); persist('clients', c, true); }
function propModal(clientId, then){
  const c = S.clients[clientId]; if (!c) return; S.propPick = {clientId, then};
  openModal(`Properties for ${esc(c.name)}`, `<label class="search" style="display:block"><span hidden>Search address</span>${I.search}<input class="in plain" id="pp-q" style="width:100%" placeholder="Search address" oninput="renderPropList(this.value)"></label><div id="pp-list" class="pc-list"></div>
    <div class="pp-new"><input class="in plain" id="pp-new" placeholder="Another address (new property)"><button class="btn" data-act="prop-pick-new">Use this one</button></div>`,
    `<button class="btn" data-act="modal-close">Cancel</button>`);
  renderPropList(''); setTimeout(()=>$('#pp-q')?.focus(), 50);
}
function renderPropList(q){
  const el = $('#pp-list'), c = S.clients[S.propPick?.clientId]; if (!el || !c) return; q = (q||'').toLowerCase().trim();
  const ps = clientProps(c).filter(x=>!q || x.toLowerCase().includes(q));

}
async function propChosen(prop){
  const pk = S.propPick; if (!pk) return; prop = String(prop||'').trim(); if (!prop) return;
  rememberProp(pk.clientId, prop); closeModal(); S.propPick = null;
  if (pk.then.kind==='new') return newDoc(pk.then.coll, {clientId:pk.clientId, property:prop});
  if (pk.then.kind==='doc'){ const o = cur(); if (o){ o.clientId = pk.clientId; o.property = prop; persist(ctxColl(), o, true); renderDrawer(); } }
}

function newDocFor(coll, clientId){ const c = S.clients[clientId]; if (clientProps(c).length>1) return propModal(clientId, {kind:'new', coll}); return newDoc(coll, {clientId}); }

async function saveDoc(){
  const D = S.doc; if (!D || D.mode!=='edit') return null;
  const d = D.draft;
  if (!d.clientId){ toast('Add a client before saving'); return null; }
  if (D.coll==='invoices' && !D.notesOk && projNotesLeft(d) > 0){ const n = projNotesLeft(d);
    openModal('Project notes not reviewed', `<p>This project has <b>${n}</b> note${n===1?'':'s'} or task${n===1?'':'s'} you have not checked off. Make sure nothing is missing from the invoice.</p>`, `<button class="btn" data-act="pn-save-anyway">Save anyway</button><button class="btn primary" data-act="modal-close">Review the notes</button>`);
    return null; }
  if (D.isNew) await nextNumber(D.coll==='invoices'?'inv':'est');
  const saved = structuredClone(d);
  rememberProp(saved.clientId, saved.property);
  learnItems(saved);
  S.doc = {coll:D.coll, id:saved.id, mode:'view'}; draftStore();
  persist(D.coll, saved, true);
  if (D.coll==='invoices') syncInvoicePayments(saved);
  toast(`${D.coll==='invoices'?'Invoice':'Estimate'} ${saved.number} saved`);
  render(); renderDocNow(); window.scrollTo(0,0);
  return saved;
}

/* ---------- Estimates & invoices list (Wave-style tabs) ---------- */
function vDocs(kind){
  const isInv = kind==='invoices';
  const all = list(kind).sort((a,b)=>String(b.date).localeCompare(String(a.date)) || String(b.number).localeCompare(String(a.number)));
  const st = d => docStatus(d, kind)[0];
  const tabs = isInv ? [['unpaid','Unpaid',d=>!['Borrador','Pagada'].includes(st(d))],['draft','Drafts',d=>st(d)==='Borrador'],['all','Todas',()=>true]]
                     : [['active','Active',d=>!['Convertido','Vencido','No aceptado'].includes(st(d))],['draft','Drafts',d=>st(d)==='Borrador'],['archived','Archived',d=>['Vencido','No aceptado'].includes(st(d))],['all','All',()=>true]];
  const key = isInv ? 'invTab' : 'estTab';
  if (!tabs.some(t=>t[0]===S[key])) S[key] = tabs[0][0];
  const q = (S.docQ||'').toLowerCase();
  const rows = all.filter(tabs.find(t=>t[0]===S[key])[2]).filter(d=>!q || [d.number, d.name, autoDocName(d), clientName(d.clientId), d.property, d.summary].join(' ').toLowerCase().includes(q));
  const today = todayISO(), in30 = addDays(today, 30);
  let tiles;
  if (isInv){
    const open = all.filter(d=>!['Borrador','Pagada'].includes(st(d)));
    const overdue = open.filter(d=>st(d)==='Vencida').reduce((a,d)=>a+docTotals(d).balance,0);
    const due30 = open.filter(d=>st(d)!=='Vencida' && (!d.due || d.due<=in30)).reduce((a,d)=>a+docTotals(d).balance,0);
    const paidInv = all.filter(d=>st(d)==='Pagada' && (d.payments||[]).length);
    const days = paidInv.map(d=>{ const last = (d.payments||[]).map(p=>p.date).filter(Boolean).sort().pop(); return last ? (new Date(last)-new Date(d.date))/86400000 : null; }).filter(v=>v!=null && v>=0);
    const thisM = curMonth(); const paidM = all.reduce((a,d)=>a+(d.payments||[]).filter(p=>monthOf(p.date)===thisM).reduce((b,p)=>b+N(p.amount),0),0);
    tiles = `<div class="card tile ${overdue?'alert':''}"><span class="label">Overdue</span><strong class="num">${fmt(overdue,1)}</strong><small>Invoices past their due date</small></div>
      <div class="card tile"><span class="label">Due in the next 30 days</span><strong class="num">${fmt(due30,1)}</strong><small>To collect soon</small></div>
      <div class="card tile"><span class="label">Average time to pay</span><strong class="num">${days.length?Math.round(days.reduce((a,b)=>a+b,0)/days.length)+' days':'—'}</strong><small>From invoice date to payment</small></div>
      <div class="card tile"><span class="label">Collected this month</span><strong class="num">${fmt(paidM,1)}</strong><small>${monthLabel(thisM)}</small></div>`;
  } else {
    const sumT = f => all.filter(f).reduce((a,d)=>a+docTotals(d).total,0);
    tiles = `<div class="card tile"><span class="label">Awaiting response</span><strong class="num">${fmt(sumT(d=>st(d)==='Enviado'),1)}</strong><small>Estimates sent</small></div>
      <div class="card tile"><span class="label">Accepted</span><strong class="num">${fmt(sumT(d=>st(d)==='Aceptado'),1)}</strong><small>Not yet converted to invoices</small></div>
      <div class="card tile"><span class="label">Converted</span><strong class="num">${fmt(sumT(d=>st(d)==='Convertido'),1)}</strong><small>Already invoiced</small></div>
      <div class="card tile"><span class="label">Drafts</span><strong class="num">${all.filter(d=>st(d)==='Borrador').length}</strong><small>Not sent</small></div>`;
  }
  const action = d => {
    const s = st(d);
    if (isInv) return s==='Borrador' ? `<button class="btn sm" data-act="row-send" data-id="${d.id}">Send</button>` : s!=='Pagada' ? `${d.sentAt?`<button class="btn sm ghost" data-act="remind" data-id="${d.id}">Remind</button>`:''}<button class="btn sm" data-act="row-pay" data-id="${d.id}">Record payment</button>` : `<span class="muted" style="font-size:12px">Paid</span>`;
    return s==='Convertido' ? `<button class="btn sm ghost" data-open="invoices:${d.convertedTo}">View invoice</button>` : s==='Borrador' ? `<button class="btn sm" data-act="row-send" data-id="${d.id}">Send</button>` : s==='No aceptado' ? `<span class="muted" style="font-size:12px">Archived</span>` : `<button class="btn sm" data-act="row-convert" data-id="${d.id}">Convert to invoice</button>`;
  };
  return `
  <div class="head"><div><h1>${isInv?'Invoices':'Estimates'}</h1><p>${isInv?'Create, send and collect on your invoices.':'Quote jobs and convert them to invoices in one click.'}</p></div>
    <div class="tools">${isInv?`${unpaidSent().length?`<button class="btn" data-act="reminders">Reminders <span class="cnt">${unpaidSent().length}</span></button>`:''}<button class="btn" data-act="quick-new">Quick service</button>`:`<button class="btn" data-go="productos">Products & services</button><button class="btn" data-act="est-photos">${I.camera} From photos</button>`}<button class="btn primary" data-act="${isInv?'new-inv':'new-est'}">${I.plus} ${isInv?'Create invoice':'Create estimate'}</button></div></div>
  ${loading()? loadingBlock(isInv?'your invoices':'your estimates') : `
  <div class="grid g4">${tiles}</div>
  <section class="card">
    <div class="tabbar-in"><div class="tabs" role="tablist">${tabs.map(([k,l,f])=>`<button role="tab" aria-selected="${S[key]===k}" data-act="doc-tab" data-key="${key}" data-v="${k}">${l} <span class="cnt">${all.filter(f).length}</span></button>`).join('')}</div>
      <label class="search"><span hidden>Search</span>${I.search}<input class="in plain" id="docq" placeholder="Search client or number" value="${esc(S.docQ||'')}"></label></div>
    ${rows.length? `<div class="tbl-wrap"><table>
    <thead><tr><th>Status</th><th>${isInv?'Due':'Date'}</th><th>Name</th><th>Client</th><th class="n">${isInv?'Balance':'Amount'}</th><th class="n">Total</th><th></th></tr></thead>
    <tbody>${rows.map(d=>{const t=docTotals(d); const s=docStatus(d,kind); return `<tr class="click" data-open="${kind}:${d.id}"><td><span class="pill ${s[1]}">${s[0]}</span>${viewPill(d)}${isInv?'':replyPill(d)}</td><td>${fdate(isInv?(d.due||d.date):d.date)}</td><td class="docname-cell"><b>${esc(docName(d,kind))}</b><div class="muted" style="font-size:12px">${esc(d.number)}</div></td><td>${esc(clientName(d.clientId)||'—')}</td><td class="n"><b>${fmt(isInv?t.balance:t.total,1)}</b></td><td class="n muted">${fmt(t.total,1)}</td><td class="n"><span class="row-acts">${action(d)}<button class="icon-btn" data-act="row-del-ask" data-id="${d.id}" title="Delete" aria-label="Delete ${esc(d.number)}">${I.trash}</button></span></td></tr>`}).join('')}</tbody></table></div>`
    : `<div class="empty"><h3>${all.length?'Nothing in this tab':(isInv?'No invoices yet':'No estimates yet')}</h3><span>${isInv?'Create an invoice or convert an accepted estimate. When you send it, your client receives the PDF and the payment button.':'Create an estimate, email it, and convert it to an invoice once it is accepted.'}</span>${all.length?'':`<button class="btn primary" data-act="${isInv?'new-inv':'new-est'}">${I.plus} ${isInv?'Create invoice':'Create estimate'}</button>`}</div>`}
  </section>`}`;
}

/* ---------- Payment links ---------- */
function payLinks(inv){
  const st = S.settings; const bal = dueNow(inv); const amt = bal.toFixed(2);
  const out = [];
  const own = (inv.payLink||'').trim();
  // Commas (formerly FanBasis) is the main processor; any pasted link that isn't Stripe or Whop is treated as Commas
  const host = u => /whop\.com/i.test(u) ? 'Whop' : /stripe\.com/i.test(u) ? 'card or bank (Stripe)' : 'card (Commas)';
  if (own) out.push({label: host(own), url: own});
  const stripe = (st.stripeLink||'').trim(), whop = (st.whopLink||'').trim(), commas = (st.fanbasisLink||'').trim();
  const ownHost = own ? host(own) : '';
  if (commas && ownHost!=='card (Commas)') out.push({label:'card (Commas)', url:commas});
  if (stripe && ownHost!=='card or bank (Stripe)') out.push({label:'card or bank (Stripe)', url:stripe});
  if (whop && ownHost!=='Whop') out.push({label:'Whop', url:whop});
  const pp = (st.paypalMe||'').trim().replace(/^.*paypal\.me\//i,'').replace(/\/.*$/,'');
  if (pp) out.push({label:'PayPal', url:`https://paypal.me/${encodeURIComponent(pp)}/${amt}USD`});
  const ca = (st.cashtag||'').trim().replace(/^\$/,'');
  if (ca) out.push({label:'Cash App', url:`https://cash.app/$${encodeURIComponent(ca)}/${amt}`});
  const vm = (st.venmo||'').trim().replace(/^@/,'');
  if (vm) out.push({label:'Venmo', url:`https://venmo.com/u/${encodeURIComponent(vm)}`});
  if ((st.zelle||'').trim()) out.push({label:'Zelle', text:`Zelle: send ${money(bal)} to ${st.zelle.trim()}`});
  if ((st.checkPayable||'').trim()) out.push({label:'Cheque', text:`Checks payable to ${st.checkPayable.trim()}`});
  let first = true; out.forEach(l => { if (l.url){ l.btn = first ? 'Pay Now' : 'Pay with '+l.label; first = false; } });
  return out;
}

function paperHTML(d, coll){
  const isInv = coll==='invoices'; const st = S.settings; const t = docTotals(d); const cl = S.clients[d.clientId] || {};
  const head = `<div class="ph"><img src="data:image/jpeg;base64,${LOGO_PDF}" alt="JC Home Services" style="width:150px">

    <div class="two"><div><div class="lab">${isInv?'Bill to':'Prepared for'}</div><b>${esc(cl.name||'—')}</b>${cl.email?'<br>'+esc(cl.email):''}</div>
      ${d.property?`<div><div class="lab">Property</div>${esc(d.property)}</div>`:''}
      ${!isInv && d.startDate?`<div><div class="lab">Estimated start</div>${fdateEn(d.startDate)}</div>`:''}

  await S.db.collection('shares').doc(d.shareToken).set(JSON.parse(JSON.stringify(shareSnapshot(d))));

}

/* ---------- Estimate replies from Gmail ---------- */
const REPLY_LBL = {accepted:['Accepted the estimate','ok'], question:['Asked a question','warn'], changes:['Requested changes','warn'], reply:['Replied','info']};
let replyUnsub = null;
function watchReplies(){
  if (replyUnsub || !S.mcp || !S.loaded.estimates || !list('estimates').some(e=>e.sentAt)) return;
  const query = '-from:me newer_than:180d subject:Estimate';
  replyUnsub = S.mcp.watchTool('Gmail','search_threads',{query, pageSize:30, view:'THREAD_VIEW_SUMMARY'}, ev => {
    if (ev.type==='error') return; processReplies(ev.result?.payload?.threads || []);
  }, {cache:{staleTime:60000, gcTime:600000}, refetchInterval:180000});
}
function processReplies(threads){
  const me = String(S.settings.email||'').toLowerCase(); const ests = list('estimates'); const changed = new Set(); const news = [];
  for (const th of threads) for (const m of (th.messages||[])){
    if (!m.sender || m.sender.toLowerCase()===me) continue;
    const subj = decodeEntities(m.subject||''); let est = null, type = 'reply', mm;
    if ((mm = subj.match(/^(?:(?:re|fwd?)\s*:\s*)*(Accepted|Question|Changes requested)\s*[-–]\s*Estimate\s+([^\s–]+)/i))){
      type = /^acc/i.test(mm[1]) ? 'accepted' : /^q/i.test(mm[1]) ? 'question' : 'changes';
      est = ests.find(e=>String(e.number).toLowerCase()===mm[2].toLowerCase());
    } else if ((mm = subj.match(/^(?:re\s*:\s*)+Estimate\s*[-–]\s*(.+?)\s*[-–]\s*[^-–]+$/i))){
      const w = normKey(mm[1]);
      est = ests.filter(e=>e.sentAt && normKey(e.property || jobAddr(S.clients[e.clientId]) || '')===w).sort((a,b)=>String(b.sentAt).localeCompare(String(a.sentAt)))[0];
    }
    if (!est) continue;
    const id = m.id || (th.id+'|'+m.date); est.replies = est.replies || [];
    if (est.replies.some(r=>r.id===id)) continue;
    const dt = m.date ? new Date(isNaN(m.date) ? m.date : Number(m.date)) : new Date(); const at = isNaN(dt) ? new Date().toISOString() : dt.toISOString();
    const who = m.addressDisplayNames?.find(a=>a.emailAddress===m.sender)?.displayName || m.sender;
    est.replies.push({id, threadId: th.id, type, at, from: who, email: m.sender, subject: subj, snippet: decodeEntities(m.snippet||'').slice(0,300), unread:'1'});
    if (type==='accepted' && !est.convertedTo && est.status!=='Aceptado'){ est.status = 'Aceptado'; est.acceptedAt = at; est.acceptedBy = who; }
    changed.add(est); news.push([est, type, who]);
  }
  if (!news.length) return;
  changed.forEach(e => persist('estimates', e, true));
  const [e, type, who] = news[news.length-1];
  toast(type==='accepted' ? `${who} accepted estimate ${e.number}` : `${who}: ${REPLY_LBL[type][0].toLowerCase()} about estimate ${e.number}`);
  if (S.view==='doc'){ if (S.doc?.mode==='view') renderDocNow(); } else renderView();
}
const unreadReplies = d => (d.replies||[]).filter(r=>r.unread);
function replyPill(d){
  const u = unreadReplies(d).filter(r=>r.type!=='accepted'); if (!u.length) return '';
  const t = u[u.length-1].type; return ` <span class="pill warn" title="${esc(REPLY_LBL[t][0])}">${t==='changes'?'Changes':t==='question'?'Question':'Reply'}</span>`;

function repliesCard(d){

/* ---------- Calendar: project dates, invoice due dates, estimate dates and the owner's own events ---------- */
const isoAdd = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function calEvents(){
  const ev = []; const okDate = x => /^\d{4}-\d{2}-\d{2}$/.test(x||'');
  const PAL = ['#1F5EFF','#0B7A75','#8A4FD3','#C2410C','#0E7490','#B4236A','#4D7C0F','#475569'];
  list('projects').sort((a,b)=>(N(a.num)||999)-(N(b.num)||999)).forEach((p, pi) => {
    const open = 'projects:'+p.id; const color = PAL[pi % PAL.length];
    if (okDate(p.start) && okDate(p.end) && p.end >= p.start) ev.push({from:p.start, to:p.end, kind:'proj', title:p.name, sub:'Project', open, color});
    else { if (okDate(p.start)) ev.push({from:p.start, to:p.start, kind:'proj', title:'Start · '+p.name, sub:'Project', open, color}); if (okDate(p.end)) ev.push({from:p.end, to:p.end, kind:'proj', title:'End · '+p.name, sub:'Project', open, color}); }
  });
  list('projects').forEach(p => (p.subs||[]).forEach(r => { const left = N(r.cost)-N(r.paid); if (!Array.isArray(r.pays) && okDate(r.date) && left > 0.004) ev.push({from:r.date, to:r.date, kind:'pay', title:`Pay ${fmt(left,1)} · ${r.name||r.work||'subcontractor'}`, sub:'Subcontractor · '+p.name, open:'projects:'+p.id}); }));
  list('invoices').forEach(i => {
    const st = invStatus(i)[0]; if (st==='Pagada' || st==='Borrador') return;
    const who = clientName(i.clientId) || i.number; const open = 'invoices:'+i.id;
    const dated = planDue(i).rows.filter(r => okDate(r.date) && r.left > 0.004);
    dated.forEach(r => ev.push({from:r.date, to:r.date, kind: r.date < todayISO() ? 'bad' : 'inv', title:`Collect ${fmt(r.left,1)} · ${who}`, sub:`${r.label||'Payment'} · invoice ${i.number}`, open}));
    if (!dated.length && okDate(i.due)) ev.push({from:i.due, to:i.due, kind: st==='Vencida'?'bad':'inv', title:`Collect ${fmt(dueNow(i),1)} · ${who}`, sub:'Invoice '+i.number+' due', open});
  });
  list('estimates').forEach(e => {
    const st = estStatus(e)[0]; const open = 'estimates:'+e.id; const pr = e.projectId && S.projects[e.projectId];
    if (st==='No aceptado' || st==='Vencido' || st==='Borrador') return;
    // once the job is a project with its own dates, the project is what shows
    if (!(pr && (pr.start || pr.end))){
      if (okDate(e.startDate) && okDate(e.completion) && e.completion >= e.startDate) ev.push({from:e.startDate, to:e.completion, kind:'est', title:docName(e,'estimates'), sub:'Estimate '+e.number+' · estimated dates', open});
      else { if (okDate(e.startDate)) ev.push({from:e.startDate, to:e.startDate, kind:'est', title:'Start · '+docName(e,'estimates'), sub:'Estimate '+e.number, open}); if (okDate(e.completion)) ev.push({from:e.completion, to:e.completion, kind:'est', title:'Completion · '+docName(e,'estimates'), sub:'Estimate '+e.number, open}); }
    }
    if (okDate(e.validUntil) && st==='Enviado') ev.push({from:e.validUntil, to:e.validUntil, kind:'est', title:'Estimate expires · '+(clientName(e.clientId)||e.number), sub:'Estimate '+e.number, open});
    // payments of the schedule, until an invoice takes over
    if (!(e.convertedTo && S.invoices[e.convertedTo])) planRows(e).rows.forEach(r => { if (okDate(r.date)) ev.push({from:r.date, to:r.date, kind:'inv', title:`Collect ${fmt(r.amount,1)} · ${clientName(e.clientId)||e.number}`, sub:`${r.label||'Payment'} · estimate ${e.number}`, open}); });
  });
  list('events').forEach(x => { if (okDate(x.date)) ev.push({from:x.date, to: okDate(x.endDate) && x.endDate >= x.date ? x.endDate : x.date, kind:'own', title:(x.time?x.time+' · ':'')+(x.title||'Event'), sub: x.projectId && S.projects[x.projectId] ? S.projects[x.projectId].name : 'Event', evId:x.id, time:x.time||''}); });
  return ev;
}
function vCalendar(){
  if (!S.calMonth) S.calMonth = curMonth();
  const [Y, M] = S.calMonth.split('-').map(Number); const first = new Date(Y, M-1, 1); const startISO = isoAdd(S.calMonth+'-01', -first.getDay());
  const today = todayISO(); const evs = calEvents();
  const on = d => evs.filter(e => e.from <= d && d <= e.to).sort((a,b)=>(b.to>b.from)-(a.to>a.from) || a.from.localeCompare(b.from) || (a.time||'').localeCompare(b.time||'') || a.title.localeCompare(b.title));

async function checkCommasPayments(){

    if (isInvMail){ const l = payLinks(doc).find(x=>x.url); if (l && docTotals(doc).balance>0.004) input.body = text + `\n\nPay online (${money(docTotals(doc).balance)}): ${l.url}`; }
    else input.body = text + (shareUrl ? `\n\nReview and ${contractText(doc)?'sign':'accept'} this estimate online: ${shareUrl}` : `\n\nTo accept this estimate, ask a question or request changes, just reply to this email.`);
    input.attachments = [{content: LOGO_PDF, filename:'jc-home-services-logo.jpg', mimeType:'image/jpeg', inline:true}, {content: pdf.base64, filename: pdf.name, mimeType:'application/pdf'}];
  }

      if (S.composeDoc.reminder) (doc.reminders ||= []).push({at:new Date().toISOString(), to:to.join(', ')});

    S.mcp.invalidate?.('Gmail').catch(()=>{});
  } catch(e){
    document.querySelectorAll('[data-act="send-mail"]').forEach(b=>b.disabled=false);

let mailUnsub = null, mailKey = '';
function loadMail(force){
  const box = $('#mailbox'); if (!box || !S.mcp) return;
  const key = S.mailQ;
  if (mailUnsub && mailKey===key && !force && S.mailCache){ box.innerHTML = S.mailCache; return; }
  mailUnsub?.(); mailKey = key;
  const input = {query:key, pageSize:25, view:'THREAD_VIEW_SUMMARY'};
  mailUnsub = S.mcp.watchTool('Gmail','search_threads', input, ev => {
    const b = $('#mailbox'); if (!b) return;
    if (ev.type==='error'){
      const retract = ['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest'].includes(ev.error?.code);
      const html = `<div class="empty"><span>${esc(gmailErr(ev.error))}</span>${ev.error?.code==='approval_required'||ev.error?.code==='not_in_manifest'?`<button class="btn primary" data-act="mail-refresh-call">Allow Gmail</button>`:''}${window.claude?.standalone && ['server_not_connected','needs_reauth'].includes(ev.error?.code)?`<button class="btn primary" data-act="gmail-connect">Connect Gmail</button>`:''}</div>`;
      if (retract || !S.mailCache) { b.innerHTML = html; S.mailCache = ''; }
      return;
    }
    const threads = ev.result?.payload?.threads || [];
    const html = threads.length ? threads.map(th=>{
      const m = (th.messages||[])[0]||{};
      const who = m.addressDisplayNames?.find(a=>a.emailAddress===m.sender)?.displayName || m.sender || '';
      const unread = (m.labelIds||[]).includes('UNREAD');
      const d = m.date ? new Date(m.date) : null;
      const when = d ? (d.toDateString()===new Date().toDateString() ? d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : MES3[d.getMonth()]+' '+d.getDate()) : '';
      return `<div class="thread ${unread?'unread':''}" data-act="open-thread" data-id="${esc(th.id)}" role="button" tabindex="0"><span class="from">${esc(who)}${th.messageCount>1?` <span class="muted">(${th.messageCount})</span>`:''}</span><span class="line"><span class="subj">${esc(decodeEntities(m.subject)||'(no subject)')}</span> — ${esc(decodeEntities(m.snippet))}</span><time>${when}</time></div>`;
    }).join('') : `<div class="empty"><span>No emails match this search.</span></div>`;
    S.mailCache = html; b.innerHTML = html;
  }, {cache:{staleTime:60000, gcTime:600000}, refetchInterval:120000});
}

async function quickSave(send){
  const msg = t => { $('#qs-msg').innerHTML = `<div class="note bad">${t}</div>`; };
  const name = $('#qs-client').value.trim(), email = $('#qs-email').value.trim(), desc = $('#qs-desc').value.trim();
  const amt = Math.round(N($('#qs-amt').value)*100)/100, cost = 0;
  if (!name) return msg('Enter the client name.');
  if (!desc) return msg('Enter the service that was done.');
  if (amt<=0) return msg('Enter the amount to charge.');
  if (send && !email) return msg('The client email is required to send it. You can also save it without sending.');
  if (quickSave.busy) return; quickSave.busy = true;
  try {
    let c = list('clients').find(x=>(x.name||'').toLowerCase()===name.toLowerCase());
    const prop = $('#qs-prop').value.trim();
    if (!c){ c = {id:uid('c'), name, contactFirst:'', contactLast:'', email, phone:'', mobile:'', company:'', website:'', account:'', address:prop, address2:'', city:'', state:'FL', zip:'', shipSame:'', notes:'', createdAt:new Date().toISOString()}; persist('clients', c, true); }
    else if (email && c.email!==email && !c.email){ c.email = email; persist('clients', c, true); }
    if ($('#qs-keep').checked){ const it = list('items').find(x=>(x.name||'').toLowerCase()===desc.toLowerCase()); if (it){ it.quick='1'; it.price=amt; persist('items', it, true); } else persist('items', {id:uid('it'), name:desc, area:'', desc:'', price:amt, quick:'1', createdAt:new Date().toISOString()}, true); }
    const extra = $('#qs-notes').value.trim();
    rememberProp(c.id, prop);
    const d = await newDoc('invoices', {clientId:c.id, property:prop||jobAddr(c)||'', summary:desc, quick:'1', cost: cost||'', terms:'0', due:todayISO(), items:[{area:'', desc: extra? desc+' - '+extra : desc, qty:1, rate:amt}], showArea:''}, true, true);
    if (email && c.email!==email) d.sendTo = email;
    closeModal(); renderView(); render();
    if (send){ await composeInvoice(d); if (email && c.email!==email){ const to = $('#m-to'); if (to) to.value = email; } }
    else toast(`Invoice ${d.number} saved`);
  } finally { quickSave.busy = false; }
}

async function shrinkImage(file){
  if (!file.type.startsWith('image/') || file.type==='image/svg+xml') return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));
  } catch(_){ return file; }
}
$('#drawer').addEventListener('change', async ev => {

/* ---------- Reportes (P&L, categories, 1099) ---------- */
const fallbackDate = (d, month) => d || (month ? month+'-01' : '');
function ledger(){
  const tx = [];
  const ps = list('projects');
  const validProj = id => !!S.projects[id];
  ps.forEach(p => {
    if (N(p.down)) tx.push({date: fallbackDate(p.downDate||p.start, p.month), kind:'in', cat:'Projects', amount:N(p.down), who:p.name, note:'Down payment'});
    (p.payments||[]).forEach(x => { if (N(x.amount)) tx.push({date: fallbackDate(x.date, p.month), kind:'in', cat:'Projects', amount:N(x.amount), who:p.name, note:x.note||'Payment'}); });
    (p.purchases||[]).forEach(x => { if (N(x.amount)) tx.push({date: fallbackDate(x.date, p.month), kind:'out', cat:'Materiales', amount:N(x.amount), who:x.store||'', note:`${x.item||'Purchase'} · ${p.name}`}); });
    if (N(p.supRate)) (p.hours||[]).forEach(x => { if (N(x.hours)) tx.push({date: fallbackDate(x.date, p.month), kind:'out', cat:'Supervisor', amount: Math.round(N(x.hours)*N(p.supRate)*100)/100, who:p.supervisor||'Supervisor', note:`${N(x.hours)} h · ${p.name}`}); });
    (p.subs||[]).forEach(x => subPays(x).forEach(y => { if (N(y.amount)) tx.push({date: fallbackDate(y.date, p.month), kind:'out', cat:'Subcontratistas', amount:N(y.amount), who:x.name||'No name', note:`${x.work||''} · ${p.name}`}); }));
  });
  list('invoices').forEach(inv => { if (validProj(inv.projectId)) return; (inv.payments||[]).forEach(x => { if (N(x.amount)) tx.push({date:x.date||inv.date, kind:'in', cat:'Invoices', amount:N(x.amount), who:clientName(inv.clientId), note:inv.number}); }); });
  quickInvs().forEach(i => { if (N(i.cost) && docTotals(i).paid>0.004) tx.push({date:i.date, kind:'out', cat:'Materiales', amount:N(i.cost), who:clientName(i.clientId), note:`Cost · ${i.summary||i.number}`}); });
  list('services').forEach(s => {
    if (N(s.charged)) tx.push({date:s.date||'', kind:'in', cat:'Services', amount:N(s.charged), who:s.client||'', note:s.name});
    const cost = N(s.charged) - N(s.profit);
    if (N(s.charged) && N(s.profit) && cost>0) tx.push({date:s.date||'', kind:'out', cat:'Materiales', amount:cost, who:s.client||'', note:`Cost · ${s.name}`});
  });
  list('expenses').forEach(e => { if (N(e.amount)) tx.push({date:e.date, kind:'out', cat:e.category||'Otros', amount:N(e.amount), who:e.vendor||'', note:[e.desc, S.projects[e.projectId]?.name].filter(Boolean).join(' · ')}); });
  return tx;
}
