<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuadra</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1b33">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuadra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/runtime.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed sidebar (desktop) / bottom tab bar (phone) + scrolling workspace; documents open in a right-hand drawer.
   Yellow-tinted inputs echo the "celdas amarillas = editar" convention from the Proyectos spreadsheet. */
:root{
  /* KUADRA: deep navy (Krontrol) · electric blue (Krecimiento) · ice blue + white (Klaridad) */
  --navy:#0B1B33; --electric:#1F5EFF; --ice:#DCEBFF; --silver:#C9D1DB;
  --k-stem:#0B1B33; --k-arm:#1F5EFF; --k-leg:#0B1B33;
  --ink:#0B1B33; --ink-2:#44536B; --ink-3:#7887A0;
  --paper:#F4F7FB; --surface:#ffffff; --surface-2:#EDF2F8; --line:#DFE6EF;
  --accent:#1F5EFF; --accent-ink:#ffffff; --accent-soft:#E6EEFF;
  --head-bg:#0B1B33; --head-ink:#ffffff;
  --edit:#fff8dc; --edit-line:#eedc9a;
  --ok:#1e7a4c; --ok-soft:#dff3e8; --warn:#9a6200; --warn-soft:#fdf0d5;
  --bad:#b4372f; --bad-soft:#fbe3e1; --info:#245ea8; --info-soft:#e1ecfa; --mute-soft:#eceef1;
  --logo-filter:none;
  --f-display:"Manrope","Inter","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,22,25,.06),0 4px 14px rgba(20,22,25,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0B1B33; --electric:#5B9BFF; --ice:#DCEBFF; --silver:#8E9AAD;
  --k-stem:#FFFFFF; --k-arm:#5B9BFF; --k-leg:#DCEBFF;
  --ink:#EAF0F8; --ink-2:#B3C0D3; --ink-3:#7F8DA3;
  --paper:#070F1E; --surface:#0E1A2E; --surface-2:#15233A; --line:#22324B;
  --accent:#6AA3FF; --accent-ink:#06101F; --accent-soft:#16284A;
  --head-bg:#15233A; --head-ink:#EAF0F8;
  --edit:#2a2618; --edit-line:#5a4f27;
  --ok:#5fcf95; --ok-soft:#173326; --warn:#e8b55a; --warn-soft:#352914;
  --bad:#f08a80; --bad-soft:#3a1d1b; --info:#8db8f0; --info-soft:#1a2a40; --mute-soft:#262a30;
  --logo-filter:invert(1) brightness(1.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0B1B33; --electric:#5B9BFF; --ice:#DCEBFF; --silver:#8E9AAD;
  --k-stem:#FFFFFF; --k-arm:#5B9BFF; --k-leg:#DCEBFF;
  --ink:#EAF0F8; --ink-2:#B3C0D3; --ink-3:#7F8DA3;
  --paper:#070F1E; --surface:#0E1A2E; --surface-2:#15233A; --line:#22324B;
  --accent:#6AA3FF; --accent-ink:#06101F; --accent-soft:#16284A;
  --head-bg:#15233A; --head-ink:#EAF0F8;
  --edit:#2a2618; --edit-line:#5a4f27;
  --ok:#5fcf95; --ok-soft:#173326; --warn:#e8b55a; --warn-soft:#352914;
  --bad:#f08a80; --bad-soft:#3a1d1b; --info:#8db8f0; --info-soft:#1a2a40; --mute-soft:#262a30;
  --logo-filter:invert(1) brightness(1.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.money{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:0 6px 4px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:1px}
.wordmark i{font-style:normal;color:var(--accent)}
.biz{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;width:100%}
.biz img{width:46px;filter:var(--logo-filter)}
.biz small{color:var(--ink-3);font-size:11px;line-height:1.3}
.biz b{display:block;color:var(--ink-2);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 6px}
.dbstate{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}

main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:28px;font-weight:800}
.head p{margin:2px 0 0;color:var(--ink-3)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--ink-3);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}

/* Goal */
.goal{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:860px){.goal{grid-template-columns:minmax(0,1fr)}}
.goal .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.05}
.goal .of{color:var(--ink-3);font-weight:500;font-size:18px}
.bar{position:relative;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar b{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.25;border-radius:99px}
.bar-legend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:0}
.sw.lt{opacity:.3}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv strong{font-family:var(--f-display);font-size:20px;font-weight:700}
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.tile strong{font-family:var(--f-display);font-size:24px;font-weight:700}
.tile small{color:var(--ink-3)}
.tile.alert strong{color:var(--bad)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tfoot td{font-weight:700;border-bottom:0}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{color:var(--ink);font-size:16px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Board */
.board-nav{display:flex;align-items:center;gap:6px}
.board-nav strong{font-family:var(--f-display);min-width:190px;text-align:center}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px;border:2px dashed transparent;transition:border-color .12s,background .12s}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col.now .col-h h3::after{content:"Este mes";margin-left:8px;font-family:var(--f-body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px;vertical-align:3px}
.col-h{display:flex;flex-direction:column;gap:6px;padding:2px 4px 6px}
.col-h h3{font-size:17px;font-weight:800}
.col-sum{display:flex;gap:12px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.col-sum b{color:var(--ink);font-weight:600}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px;cursor:grab;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--ink-3)}
.pcard.dragging{opacity:.4}
.pcard h4{font-size:15px;font-weight:700;line-height:1.25}
.pcard .meta{font-size:12px;color:var(--ink-3)}
.pcard .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:9px}
.pcard .figs div{display:flex;flex-direction:column}
.pcard .figs span{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.pcard .figs b{font-size:13px;font-variant-numeric:tabular-nums}
.pcard .mover{display:none}
@media (pointer:coarse){.pcard .mover{display:block}.pcard{cursor:pointer}}
.add-in-col{border:1px dashed var(--ink-3);background:none;border-radius:8px;padding:9px;color:var(--ink-3);cursor:pointer;font-weight:600}
.add-in-col:hover{color:var(--accent);border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Forms */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > span{font-size:12px;color:var(--ink-2);font-weight:500}
.in,select.in,textarea.in{width:100%;border:1px solid var(--edit-line);background:var(--edit);border-radius:7px;padding:8px 10px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.plain{background:var(--surface);border-color:var(--line)}
textarea.in{resize:vertical;min-height:80px}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{padding-left:32px;width:220px;max-width:100%}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.legend-edit{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.legend-edit i{width:14px;height:10px;border-radius:2px;background:var(--edit);border:1px solid var(--edit-line)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.dr-h .title-in{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;font-weight:800;border:1px solid transparent;background:none;padding:4px 6px;border-radius:6px}
.dr-h .title-in:hover{border-color:var(--line)}
.dr-h .title-in:focus{border-color:var(--accent);outline:none;background:var(--edit)}
.dr-b{flex:1;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:16px}
.dr-b > *{flex-shrink:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{font-size:14px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.stats b.neg{color:var(--bad)} .stats b.pos{color:var(--ok)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rows{display:flex;flex-direction:column;gap:8px}
.rowline{display:grid;gap:8px;align-items:center}
.rowline.hdr{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.r-pay{grid-template-columns:130px 120px minmax(0,1fr) 30px}
.r-buy{grid-template-columns:130px minmax(0,1.4fr) minmax(0,1fr) 110px 30px}
.r-sub{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) 95px 95px 130px 80px 30px}
.r-task{grid-template-columns:minmax(0,1fr) 140px minmax(0,.8fr) 30px}
.r-item{grid-template-columns:minmax(0,1fr) 70px 110px 110px 30px}
.r-eitem{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr) 56px 100px 96px 30px}
.r-ipay{grid-template-columns:130px 120px minmax(0,1fr) 30px}
.calc{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-right:4px}
@media (max-width:640px){
  .rowline.hdr{display:none}
  .rowline{grid-template-columns:repeat(2,minmax(0,1fr))!important;background:var(--surface-2);padding:8px;border-radius:8px}
  .rowline > :first-child{grid-column:1/-1}
  .rowline .icon-btn{justify-self:end}
}
.totline{display:flex;justify-content:flex-end;gap:18px;font-size:13px;flex-wrap:wrap}
.totline b{font-variant-numeric:tabular-nums}
.dr-actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{display:flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:8px;font-weight:600;flex-wrap:wrap}

/* AI assistant box */
.btn[hidden],.aibox [hidden]{display:none!important}
.aibox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ai-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ai-badge{font-weight:600;color:var(--ink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ai-h small{color:var(--ink-3);font-size:13px}
.aibox textarea{min-height:76px;background:var(--surface)}
.ai-partial{font-size:13px;color:var(--ink-3);font-style:italic;min-height:0}
.ai-partial:empty{display:none}
.ai-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.notes-mic{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.notes-mic .dictp{flex:1;min-width:0}
.micbtn.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.replies{display:flex;flex-direction:column;gap:10px;padding:16px}
.reply{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.reply.unread{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.reply-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.reply p{margin:0;font-size:14px;color:var(--ink-2)}
.aifiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);max-width:100%;text-decoration:none}
a.fchip{padding-right:10px}
.fchip b{font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.fchip a{font-size:12px;font-weight:600;color:var(--accent);text-decoration:none}
.fchip .icon-btn{width:24px;height:24px}
.aiqs{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}

.pj-group{display:flex;flex-direction:column;gap:12px}
.pj-gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}

.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pjcard{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font:inherit;color:inherit;cursor:pointer;min-width:0}

.pj-top{display:flex;align-items:flex-start;gap:10px}
.pj-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.pj-name small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pj-nums > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.pj-nums small{color:var(--ink-3);font-size:11px}
.pj-nums b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pj-foot{display:flex;flex-direction:column;gap:6px}
.pj-foot small{color:var(--ink-3);font-size:12px}
.num.neg,.neg{color:var(--bad)}
.row-acts{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end}
.row-acts .icon-btn{color:var(--ink-3)}
.row-acts .icon-btn:hover{color:var(--bad)}
.doc-danger{display:flex;justify-content:flex-end}
.docname-cell b{font-weight:600}
.docname-f .in{font-size:16px;font-weight:500}
/* project page */
.drawer.full .dr-b.pj-b{gap:18px;padding-top:18px}
.pj-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pj-meta-l{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mini .in{min-width:150px}
.pj-who{color:var(--ink-2);font-size:14px;padding-bottom:9px}
.pj-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi > span{font-size:12px;color:var(--ink-3)}

.kpi.hl{background:var(--accent-soft);border-color:transparent}
.pj-tabs{border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pj-tabs::-webkit-scrollbar{display:none}
.pj-tabs button{white-space:nowrap}
.pj-body{display:flex;flex-direction:column;gap:16px}
.pj-two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.pj-card{overflow:hidden;display:flex;flex-direction:column}
.pj-card > h3{padding:16px 18px 10px}
.pj-card .fgrid{padding:4px 18px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.pj-card .fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pj-card .fgrid + .fgrid{padding-top:0;grid-template-columns:minmax(0,1fr)}
.pj-pad{padding:4px 18px 16px;display:flex;flex-direction:column;gap:8px}
.nlist{padding:2px 18px 16px;display:flex;flex-direction:column;gap:9px}
.nlist hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
.nline{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-2)}
.nline b{color:var(--ink);font-variant-numeric:tabular-nums}
.nline.strong{font-weight:600;color:var(--ink)}
.pj-todo{list-style:none;margin:0;padding:0 18px 14px;display:flex;flex-direction:column;gap:10px}
.pj-todo li{display:flex;gap:10px;align-items:flex-start}
.pj-todo .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-top:7px;flex:none}
.pj-todo .dot.warn{background:var(--warn)}
.pj-todo b{font-weight:500;display:block}
.pj-todo small{color:var(--ink-3);font-size:13px;display:block}
/* calmer fields and tables inside the project page */
.drawer.full .in{background:var(--surface);border-color:var(--line)}
.drawer.full .in:hover{border-color:var(--ink-3)}
.drawer.full .in:focus{background:var(--surface)}
.drawer.full .ptbl{border-top:1px solid var(--line)}
.drawer.full .ptr{padding:8px 14px}
.drawer.full .ptr.hd{background:none;padding-top:10px;padding-bottom:6px}
.drawer.full .ptr.tot{background:var(--surface-2);font-weight:600}
.drawer.full .ptr:last-child{border-bottom:0}
@media (max-width:1100px){.pj-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.pj-two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .g3,.g2,.pj-stats.g4{grid-template-columns:minmax(0,1fr)}
  .pj-stats.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pj-grid{grid-template-columns:minmax(0,1fr)}
  .pj-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pj-kpis .kpi.hl{grid-column:1/-1}

  .pj-who{padding-bottom:0;width:100%}
  .mini{flex:1}.mini .in{min-width:0;width:100%}
  .tabbar button{flex:1 1 0}
}
/* ===== The estimate / invoice editor reads as the document itself ===== */
.docname-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.docname-row > span{white-space:nowrap}
.docname-row .in{flex:1;min-width:200px;max-width:520px;background:transparent;border-color:transparent;border-bottom-color:var(--line);border-radius:0;padding:6px 2px;font-size:15px;color:var(--ink)}
.docname-row .in:focus{outline:0;border-bottom-color:var(--accent)}
.docname-row .linkbtn{margin-left:auto;font-weight:500;font-size:13px}
.dp-headline h1{font-size:26px}
.doc-paper{
  /* a sheet of paper: always light, whatever the app theme */
  --ink:#0B1B33; --ink-2:#44536B; --ink-3:#8492A8; --surface:#ffffff; --surface-2:#F5F8FC; --line:#E3E9F1; --paper:#F4F7FB;
  --accent:#1F5EFF; --accent-soft:#EAF0FF; --edit:#ffffff; --edit-line:#E3E9F1; --logo-filter:none;
  --warn:#9a6200; --warn-soft:#fdf3dc; --bad:#b4372f; --bad-soft:#fbe3e1;
  color:var(--ink); color-scheme:light; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
  box-shadow:0 1px 2px rgba(11,27,51,.04), 0 12px 40px rgba(11,27,51,.07); border-top:4px solid #0B1B33;
}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;padding:36px 40px 28px;flex-wrap:wrap}
.lh-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.lh-logo{width:168px;height:auto;display:block}
.lh-biz{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2);line-height:1.5}
.lh-biz b{color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.01em}
.lh-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:1;min-width:240px;max-width:400px;margin-left:auto}
.lh-title{font-family:var(--f-display);font-size:34px;font-weight:300;letter-spacing:.3em;margin-right:-.3em;color:var(--ink);line-height:1}
.lh-no{font-size:13px;color:var(--ink-3);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.doc-paper .in.plain.lh-sum{margin-top:10px;text-align:right;border-color:transparent;border-bottom-color:var(--line);border-radius:0;padding:6px 2px;background:transparent;font-size:14px}
.doc-paper .in.plain.lh-sum:focus{outline:0;border-bottom-color:var(--accent)}
.doc-paper .dp-head{padding:26px 40px 30px;gap:40px;border-top:1px solid var(--line)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc-paper .dp-left{gap:10px;max-width:440px}
.doc-paper .dp-left .f > span,.doc-paper .dp-notes .label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.doc-paper .dp-left .f{margin-top:8px}
.doc-paper .custbox{border:0;padding:0;min-height:0;gap:2px;font-size:14px;line-height:1.5}
.doc-paper .custbox.empty{border:1px dashed #C9D3E0;border-radius:10px;padding:22px;justify-content:center;font-size:15px;font-weight:600;gap:8px;min-height:92px;background:var(--surface-2)}
.doc-paper .custbox.empty svg{width:18px;height:18px;color:var(--accent)}
.doc-paper .custlinks{flex-direction:row;gap:16px;margin-top:6px}
.doc-paper .custlinks .linkbtn{font-size:13px;font-weight:500}
.doc-paper .dp-meta{gap:8px;max-width:400px;margin-left:auto;width:100%}
.doc-paper .mrow{grid-template-columns:minmax(0,1fr) minmax(0,190px);gap:16px;align-items:center}
.doc-paper .mrow > span{font-weight:500;font-size:13px;color:var(--ink-2);padding-top:0}
.doc-paper .in.plain{border-color:var(--line);background:#fff;border-radius:8px}
.doc-paper .in.plain:hover{border-color:#C9D3E0}
.doc-paper .dp-cols{padding:0 40px;display:flex;justify-content:flex-end;margin-bottom:6px}
.doc-paper .editcols{background:none;padding:4px 0;font-weight:500;font-size:13px;color:var(--ink-3);border-radius:0}
.doc-paper .editcols:hover{color:var(--accent)}
.doc-paper .dp-cols .menu-list{left:auto;right:0}
.doc-paper .dp-irow{padding:10px 40px;border-bottom:1px solid var(--line)}
.doc-paper .dp-irow.hd{background:none;border-top:2px solid #0B1B33;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding-block:12px;align-items:end}
.doc-paper .eyehd{flex-direction:row-reverse;align-items:center;gap:6px;justify-content:flex-start}
.doc-paper .eyehd .eye svg{width:15px;height:15px}
.doc-paper .dp-irow .in.plain{border-color:transparent;background:transparent;padding-left:0}
.doc-paper .dp-irow .in.plain.n{padding-left:10px;padding-right:0}
.doc-paper .dp-irow .in.plain:hover{border-bottom-color:var(--line)}
.doc-paper .dp-irow .in.plain:focus{background:#fff;border-color:var(--line);padding-left:10px;padding-right:10px}
.doc-paper .dp-irow .in.needs{border-color:var(--bad);background:var(--bad-soft);padding-left:10px;padding-right:10px}
.doc-paper .hidnote{padding:10px 40px;font-size:12.5px}
.doc-paper .dp-add{padding:14px 40px;border-bottom:0}
.doc-paper .dp-tot{padding:18px 40px 22px;border-bottom:0;gap:8px;color:var(--ink-2);font-size:14px}
.doc-paper .dtr b{color:var(--ink)}
.doc-paper .dtr.total{border-top:2px solid #0B1B33;margin-top:10px;padding-top:14px;font-size:20px;font-weight:600;color:var(--ink);min-width:min(420px,100%);font-family:var(--f-display)}
.doc-paper .dtr.total .cur{border:0;padding:0;font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.doc-paper .dp-dep{padding:0 40px 18px;border-bottom:0}
.doc-paper .dp-notes{padding:22px 40px 36px;border-top:1px solid var(--line);background:var(--surface-2)}
.doc-paper .dp-notes textarea{margin-top:6px}
@media (max-width:760px){
  .lh{padding:24px 20px 20px;gap:18px}
  .lh-r{align-items:flex-start;margin-left:0;max-width:none}
  .lh-title{font-size:26px}
  .doc-paper .in.plain.lh-sum{text-align:left;width:100%}
  .lh-logo{width:132px}
  .doc-paper .dp-head{padding:20px;gap:22px}
  .doc-paper .dp-meta{margin-left:0;max-width:none}
  .doc-paper .dp-cols,.doc-paper .dp-add,.doc-paper .hidnote{padding-left:20px;padding-right:20px}
  .doc-paper .dp-irow{padding:12px 20px}
  .doc-paper .dp-irow .in.plain{border-color:var(--line);background:#fff;padding-left:10px;padding-right:10px}
  .doc-paper .dp-irow .in.plain.n{padding-left:10px;padding-right:10px}
  .doc-paper .dp-tot,.doc-paper .dp-dep{padding-left:20px;padding-right:20px}
  .doc-paper .dp-notes{padding:20px}
  .docname-row .linkbtn{margin-left:0}
}
.dp-plan{padding:20px 40px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dp-plan-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plan-presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.plan-rows{display:flex;flex-direction:column}
.plan-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 84px 92px 120px 32px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.plan-row.hd{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-bottom:8px}
.plan-row .r{text-align:right}
.plan-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.plan-status{font-size:13px;font-weight:600}
.plan-status.ok{color:var(--ok,#1e7a4c)}
.plan-status.warn{color:var(--warn)}
.plan-contract{font-size:14px;color:var(--ink-2);padding-top:4px}
.signed{display:flex;align-items:center;gap:18px;padding:16px 18px;flex-wrap:wrap}
.signed img{height:56px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.signed-t{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){
  .dp-plan{padding:18px 20px}
  .plan-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 0}
  .plan-row.hd{display:none}
  .plan-row > :nth-child(1),.plan-row > :nth-child(2){grid-column:1/-1}
  .plan-row > :nth-child(5){grid-column:1;text-align:left}
  .plan-row > :nth-child(6){grid-column:2;justify-self:end}
}
/* icons inside text never grow past text size */
:where(.note,.hidnote,.banner,.toast,.pill,small,p,label,.muted) > svg{width:16px;height:16px;flex:none;vertical-align:-3px;display:inline-block}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

/* Email */
.mail{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.thread{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) auto;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.thread:hover{background:var(--surface-2)}
.thread.unread .from,.thread.unread .subj{font-weight:700}
.thread .from{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}
.thread .line .subj{color:var(--ink)}
.thread time{font-size:12px;color:var(--ink-3);white-space:nowrap}
@media (max-width:640px){.thread{grid-template-columns:minmax(0,1fr) auto}.thread .line{grid-column:1/-1}}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);margin:0;font-size:13px;max-height:420px;overflow:auto}

/* Clients */
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.ccard:hover{border-color:var(--ink-3)}
.ccard h4{font-size:16px}
.ccard .figs{display:flex;gap:16px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
.ccard .figs b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;flex:none}

/* Toast + banner */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;opacity:0;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-weight:500}

/* Mobile */
.tabbar{display:none}
.mob-top{display:none}
@media (max-width:860px){

  .side{display:none}

  .mob-top img{height:34px;filter:var(--logo-filter)}

  .tabbar button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 4px;font-size:10px;font-weight:600;color:var(--ink-3);border-radius:8px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .head h1{font-size:24px}
  .search input{width:100%}
  .board{grid-auto-columns:minmax(272px,86%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function pc(p){
  const price = N(p.price), down = N(p.down);
  const extra = (p.payments||[]).reduce((a,x)=>a+N(x.amount),0);
  const cobrado = down + extra;
  // receipts saved in Gastos and linked to this project count here too
  const linked = Object.values(S.expenses).filter(e=>e.projectId===p.id);
  const lSub = linked.filter(e=>e.category==='Subcontratistas').reduce((a,x)=>a+N(x.amount),0);
  const lBuy = linked.filter(e=>e.category!=='Subcontratistas').reduce((a,x)=>a+N(x.amount),0);
  const compras = (p.purchases||[]).reduce((a,x)=>a+N(x.amount),0) + lBuy;
  const subCost = (p.subs||[]).reduce((a,x)=>a+N(x.cost),0) + lSub;
  const subPaid = (p.subs||[]).reduce((a,x)=>a+N(x.paid),0) + lSub;
  const gastos = compras + subCost;
  const ganancia = price === 0 ? N(p.profitNote) : price - gastos;
  const tasks = (p.tasks||[]).filter(t=>t.text);
  const progress = p.status==='Completado' ? 1 : (tasks.length ? tasks.filter(t=>t.status==='Completado').length/tasks.length : 0);
  return { price, down, extra, cobrado, falta: price - cobrado, pctCobrado: price>0 ? cobrado/price : 0,
    compras, subCost, subPaid, subFalta: subCost-subPaid, gastos, ganancia, margen: price>0 ? ganancia/price : 0,
    efectivo: cobrado - compras - subPaid, progress };
}
// Which columns the client sees (Wave's eye icons). Estimates default to hidden (only the TOTAL); older invoices follow showPrices.
function docCols(d, coll){
  const dflt = coll==='invoices' ? (d.showPrices ? '' : '1') : '1';
  return { qty: !(d.hideQty ?? dflt), price: !(d.hidePrice ?? dflt), amount: !(d.hideAmount ?? dflt) };
}
function docTotals(d){
  const base = (d.items||[]).reduce((a,x)=>a+N(x.qty||1)*N(x.rate),0);
  // optional profit markup (e.g. 15%) applied to the whole total; item prices are never shown on estimates
  const disc = d.showDisc ? Math.min(base, d.discType==='%' ? base*N(d.discount)/100 : N(d.discount)) : 0;
  const net = base - disc;
  const mk = d.useMarkup ? net * N(d.markup)/100 : 0;
  const sub = net + mk;
  const tax = sub * N(d.taxRate)/100;
  const total = Math.round((sub + tax)*100)/100;
  const paid = (d.payments||[]).reduce((a,x)=>a+N(x.amount),0);
  const dep = d.showDep ? Math.round((d.depType==='$' ? N(d.deposit) : total*N(d.deposit)/100)*100)/100 : 0;
  return { base, disc, mk, sub, tax, total, paid, dep, balance: total - paid };
}

function planRows(d){
  const total = docTotals(d).total; let used = 0;
  const rows = (d.plan||[]).map((r,i) => { let a = r.kind==='$' ? N(r.value) : r.kind==='rest' ? 0 : total*N(r.value)/100; a = Math.round(a*100)/100; if (r.kind!=='rest') used += a; return {...r, i, amount:a}; });
  rows.forEach(r => { if (r.kind==='rest') r.amount = Math.max(0, Math.round((total-used)*100)/100); });
  const sum = Math.round(rows.reduce((a,r)=>a+r.amount,0)*100)/100;
  return { rows, sum, total, diff: Math.round((total-sum)*100)/100 };
}

  if (what && street && !what.toLowerCase().includes(street.toLowerCase())) return `${what} · ${street}`;

/* ---------- Persistence ---------- */
const saveTimers = {};
function persist(coll, obj, immediate){
  if (S.doc && S.doc.mode==='edit' && obj === S.doc.draft){ S.doc.dirty = true; return; }
  if (coll==='items' && obj._chunk){ S.items[obj.id] = obj; persistChunk(obj._chunk); return; }
  S[coll][obj.id] = obj;
  const run = async () => {
    if (!S.db) return;
    const { id, ...body } = obj;
    body.updatedAt = new Date().toISOString();
    try { await S.db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body))); }
    catch(e){ handleDbErr(e); }
  };
  const key = coll+'/'+obj.id;
  clearTimeout(saveTimers[key]);
  if (immediate) return run();
  saveTimers[key] = setTimeout(run, 500);
}
async function remove(coll, id){
  if (coll==='items' && S.items[id]?._chunk){ const ch = S.items[id]._chunk; delete S.items[id]; persistChunk(ch); return; }
  delete S[coll][id];
  if (S.db) { try { await S.db.collection(coll).doc(id).delete(); } catch(e){ handleDbErr(e); } }
}
async function saveSettings(){
  clearTimeout(saveTimers.settings);
  saveTimers.settings = setTimeout(async()=>{ if(!S.db) return; try{ await S.db.doc('settings/main').set(JSON.parse(JSON.stringify(S.settings))); }catch(e){ handleDbErr(e); } }, 500);
}
function handleDbErr(e){
  const m = {quota_exceeded:'La base de datos está llena. Borra registros viejos para seguir guardando.', invalid_argument:'No tienes permiso para guardar cambios en esta app.', revoked:'Se perdió el acceso a los datos. Recarga la página.', resource_exhausted:'Demasiados cambios seguidos. Espera unos segundos.'}[e?.code];
  toast(m || 'No se pudo guardar. Revisa tu conexión.');
}

function setDb(state, txt){
  for (const [d,t] of [['#dbdot','#dbtxt'],['#dbdot2','#dbtxt2']]) { const el=$(d); if(el){ el.className='dot '+state; $(t).textContent=txt; } }
}
async function boot(){
  render();
  const claude = window.claude;
  if (!claude?.use){ offline(); return; }
  const loadTimer = setTimeout(()=>{ if(!S.live){ setDb('off','Sin conexión'); $('#banner').innerHTML='<div class="banner">Tus datos aún no cargan. Revisa tu conexión; la app sigue intentando.</div>'; } }, 10000);
  claude.use('db').then(db => {
    if (!db){ clearTimeout(loadTimer); offline(); return; }
    S.db = db;
    for (const c of COLL){
      db.collection(c).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = {id:d.id, ...structuredClone(d.data())}; });
        if (c==='items') Object.values(S.items).forEach(x => { if (x._chunk) next[x.id] = x; });
        // keep unsaved local edits for the doc open in the drawer
        if (S.drawer && S.drawer.coll===c && next[S.drawer.id]) next[S.drawer.id] = S[c][S.drawer.id] || next[S.drawer.id];
        S[c] = next; S.loaded[c] = !snap.metadata.fromCache || S.loaded[c]; if (c==='estimates') setTimeout(watchReplies, 0);
        if (!snap.metadata.fromCache){ S.live = true; clearTimeout(loadTimer); setDb('on','Guardado en la nube'); $('#banner').innerHTML=''; }
        renderView();
      }, e => { setDb('off','Error de datos'); clearTimeout(loadTimer); $('#banner').innerHTML = `<div class="banner">No se pudieron cargar los datos (${esc(e.code)}). Recarga la página.</div>`; });
    }
    db.collection('catalog').onSnapshot(snap => {
      Object.keys(S.items).forEach(k => { if (S.items[k]._chunk) delete S.items[k]; });
      snap.docs.forEach(d => { (d.data().items||[]).forEach(it => { S.items[it.id] = {...structuredClone(it), _chunk: d.id}; }); });
      if (S.view==='productos') renderView();
    }, ()=>{});
    db.doc('settings/main').onSnapshot(s => { if (s.exists) S.settings = {...DEFAULT_SETTINGS, ...structuredClone(s.data())}; S.loaded.settings=true; if(S.view==='ajustes' && document.activeElement?.closest?.('#view')) return; renderView(); }, ()=>{});
  });
  claude.use('mcp').then(m => { S.mcp = m; if (S.view==='email') renderView(); watchReplies(); });
  claude.use('downloads').then(d => { S.dl = d; });
  Promise.resolve().then(()=>claude.standalone ? claude.use('commas') : null).then(c => { S.commas = c || null; if (c){ checkCommasPayments(); setInterval(checkCommasPayments, 300000); if (S.view==='doc') renderDocNow(); } }).catch(()=>{});
  aiInit();
  claude.use('assets').then(a => { S.assets = a; if (S.drawer?.coll==='expenses') renderDrawer(); });
}

function go(v){

    openModal('Cambios sin guardar', `<p>Tienes cambios sin guardar en este ${docLabel(S.doc.coll)}. ¿Qué quieres hacer?</p>`, `<button class="btn" data-act="modal-close">Seguir editando</button><button class="btn danger" data-act="go-discard">Salir sin guardar</button><button class="btn primary" data-act="go-save">Guardar</button>`);
    return;
  }
  S.forceGo = false; S.doc = null; if (!$('#modal').hidden) closeModal();
  S.view = v; try{ history.replaceState(null,'','#'+v); }catch(e){} render(); window.scrollTo(0,0);
}

function renderView(){

/* ---------- Projects board ---------- */
function defaultBoardStart(){
  const ms = list('projects').map(p=>p.month).filter(Boolean).sort();
  const cm = curMonth();
  if (!ms.length) return shiftMonth(cm,-1);
  const first = ms[0];
  // show up to 3 months ending at least at current month
  return first < shiftMonth(cm,-2) ? shiftMonth(cm,-1) : first;
}
function vBoard(){
  if (!S.boardStart && S.loaded.projects) S.boardStart = defaultBoardStart();
  const start = S.boardStart || shiftMonth(curMonth(),-1);
  const months = [0,1,2].map(i=>shiftMonth(start,i));
  const q = S.boardQ.toLowerCase();
  const match = p => (S.boardFilter==='Todos' || p.status===S.boardFilter) && (!q || [p.name,p.owner,p.type,p.location,clientName(p.clientId)].join(' ').toLowerCase().includes(q));
  const ps = list('projects');
  const other = ps.filter(p=>!months.includes(p.month) && match(p));
  const col = m => {
    const items = ps.filter(p=>p.month===m && match(p)).sort((a,b)=>(a.order||0)-(b.order||0));
    const all = ps.filter(p=>p.month===m);
    return `<section class="col ${m===curMonth()?'now':''}" data-month="${m}">
      <div class="col-h"><h3>${monthLabel(m)}</h3>
        <div class="col-sum"><span><b>${all.length}</b> proyecto${all.length===1?'':'s'}</span><span>Costo <b>${fmt(all.reduce((a,p)=>a+pc(p).price,0))}</b></span><span>Ganancia <b>${fmt(all.reduce((a,p)=>a+pc(p).ganancia,0))}</b></span></div></div>
      ${items.map(card).join('')}
      <button class="add-in-col" data-act="new-project" data-month="${m}">+ Agregar proyecto</button>

  };
  return `
  <div class="head"><div><h1>Proyectos por mes</h1><p>Arrastra un proyecto a otro mes para moverlo.</p></div>
    <div class="tools"><button class="btn primary" data-act="new-project">${I.plus} Nuevo proyecto</button></div></div>
  ${projTabs()}
  <div class="tools" style="justify-content:space-between">
    <div class="board-nav"><button class="btn sm" data-act="board-shift" data-n="-1" aria-label="Mes anterior">${I.left}</button><strong>${monthLabel(months[0]).split(' ')[0]} – ${monthLabel(months[2])}</strong><button class="btn sm" data-act="board-shift" data-n="1" aria-label="Mes siguiente">${I.right}</button><button class="btn sm ghost" data-act="board-today">Hoy</button></div>
    <div class="tools">
      <div class="chips">${['Todos','En progreso','Incompleto','No comenzado','Completado'].map(s=>`<button class="chip" data-act="board-filter" data-v="${s}" aria-pressed="${S.boardFilter===s}">${s}</button>`).join('')}</div>
      <label class="search"><span hidden>Buscar</span>${I.search}<input class="in plain" id="boardq" placeholder="Buscar proyecto u owner" value="${esc(S.boardQ)}"></label>
    </div>
  </div>
  ${loading()? loadingBlock('tus proyectos') : `<div class="board" id="board">${months.map(col).join('')}</div>
  ${other.length? `<section class="card"><div class="pad" style="padding-bottom:4px"><h3 style="font-size:15px">En otros meses (${other.length})</h3></div><div class="tbl-wrap"><table><tbody>${other.map(p=>`<tr class="click" data-open="projects:${p.id}"><td><b>${esc(p.name)}</b></td><td>${esc(monthLabel(p.month))}</td><td>${statusPill(p.status,P_STATUS)}</td><td class="n">${fmt(pc(p).ganancia)}</td></tr>`).join('')}</tbody></table></div></section>`:''}`}`;
}
function card(p){
  const c = pc(p);
  return `<article class="pcard" draggable="true" data-id="${p.id}" data-open="projects:${p.id}" tabindex="0">
    <div class="row" style="align-items:flex-start"><h4>${p.num?`<span class="muted num" style="font-weight:600">${pnum(p)}</span> `:''}${esc(p.name||'Sin nombre')}</h4>${statusPill(p.status,P_STATUS)}</div>
    <div class="meta">${esc([clientName(p.clientId)||p.owner, p.type, p.location].filter(Boolean).join(' · ')||'Sin detalles')}${p.end?` · termina ${fdate(p.end)}`:''}</div>
    <div class="row"><div class="prog" style="flex:1"><i style="width:${c.progress*100}%"></i></div><span class="muted" style="font-size:11px">${pct(c.progress)}</span></div>
    <div class="figs"><div><span>Costo</span><b>${c.price?fmt(c.price):'—'}</b></div><div><span>Cobrado</span><b>${c.price?pct(c.pctCobrado):fmt(c.cobrado)}</b></div><div><span>Ganancia</span><b>${fmt(c.ganancia)}</b></div></div>
    <label class="mover" data-stop><span class="label">Mover a</span><select class="in plain" data-move="${p.id}">${monthOptions(p.month)}</select></label>
  </article>`;
}
function wireBoard(){
  const b = $('#board'); const q = $('#boardq');
  if (q) q.oninput = e => { S.boardQ = e.target.value; const pos = e.target.selectionStart; renderView(); const n=$('#boardq'); n.focus(); n.setSelectionRange(pos,pos); };
  if (!b) return;
  let dragId = null;
  b.addEventListener('dragstart', e => { const c = e.target.closest('.pcard'); if(!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain', dragId);}catch(_){} });
  b.addEventListener('dragend', e => { e.target.closest?.('.pcard')?.classList.remove('dragging'); b.querySelectorAll('.col.drop').forEach(c=>c.classList.remove('drop')); });
  b.addEventListener('dragover', e => { const col = e.target.closest('.col'); if(!col) return; e.preventDefault(); b.querySelectorAll('.col.drop').forEach(c=>c!==col&&c.classList.remove('drop')); col.classList.add('drop'); });
  b.addEventListener('drop', e => { const col = e.target.closest('.col'); if(!col||!dragId) return; e.preventDefault(); moveProject(dragId, col.dataset.month, e.target.closest('.pcard')?.dataset.id); dragId=null; });
  b.addEventListener('change', e => { const s = e.target.closest('[data-move]'); if (s) moveProject(s.dataset.move, s.value); });
}
function moveProject(id, month, beforeId){
  const p = S.projects[id]; if(!p) return;
  const inCol = list('projects').filter(x=>x.month===month && x.id!==id).sort((a,b)=>(a.order||0)-(b.order||0));
  let order;
  if (beforeId && beforeId!==id){ const i = inCol.findIndex(x=>x.id===beforeId); const prev = inCol[i-1]; order = prev ? ((prev.order||0)+(inCol[i].order||0))/2 : (inCol[i].order||0)-1; }
  else order = inCol.length ? (inCol[inCol.length-1].order||0)+1 : 1;
  const changed = p.month!==month;
  p.month = month; p.order = order;
  persist('projects', p, true); renderView();
  if (changed) toast(`Movido a ${monthLabel(month)}`);
}

/* ---------- Drawer framework ---------- */
function openDrawer(coll, id){
  if (coll==='estimates' || coll==='invoices'){ openDoc(coll, id, 'view'); return; }
  S.drawer = {coll, id, confirm:false};
  $('#drawer').classList.toggle('wide', coll==='estimates'||coll==='invoices'||coll==='projects');
  $('#drawer').classList.toggle('full', coll==='projects');
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false'); $('#scrim').classList.add('open');
  document.body.style.overflow='hidden';
  renderDrawer();
}
function closeDrawer(){
  if (!S.drawer) return;
  const {coll,id} = S.drawer; const o = S[coll][id];
  if (o) persist(coll, o, true);
  S.drawer = null;
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('open');
  document.body.style.overflow='';
  renderView(); render();
}
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (!$('#modal').hidden) closeModal(); else closeDrawer(); } });
function renderDrawer(focusSel){
  if (!S.drawer){ if (S.view==='doc') renderDocNow(focusSel); return; }
  const {coll,id} = S.drawer; const o = S[coll][id];
  if (!o){ closeDrawer(); return; }
  const scroll = $('.dr-b')?.scrollTop || 0;
  $('#drawer').innerHTML = {projects:drProject, estimates:drDoc, invoices:drDoc, clients:drClient, expenses:drExpense}[coll](o, coll);
  const b = $('.dr-b'); if (b) b.scrollTop = scroll;

function convertEstimate(e){
  // copy every line; fold only the markup into each price, keep the discount as its own line (like Wave)
  const t = docTotals(e); const f = e.useMarkup ? 1 + N(e.markup)/100 : 1;
  const items = (e.items||[]).filter(r=>(r.desc||'').trim()||N(r.rate)).map(r=>({area:r.area||'', desc:r.desc||'', qty:r.qty||1, rate: Math.round(N(r.rate)*f*100)/100}));
  const diff = Math.round((t.base*f - items.reduce((a,r)=>a+N(r.qty||1)*N(r.rate),0))*100)/100;
  if (diff && items.length){ const last = items[items.length-1]; last.rate = Math.round((N(last.rate) + diff/N(last.qty||1))*100)/100; }
  return newDoc('invoices', {clientId:e.clientId, projectId:e.projectId, property:e.property, summary:e.summary||'', items, taxRate:e.taxRate, showTax:e.showTax||'', fromEstimate:e.id, showDisc:e.showDisc||'', discType:e.discType||'$', discLabel:e.discLabel||'', discount: e.showDisc ? (e.discType==='%' ? e.discount : Math.round(N(e.discount)*f*100)/100) : '', showPrices:'', hideQty:docCols(e,'estimates').qty?'':'1', hidePrice:docCols(e,'estimates').price?'':'1', hideAmount:docCols(e,'estimates').amount?'':'1', notes:S.settings.invTerms}, true).then(inv => {
    e.convertedTo = inv.id; e.status = 'Aceptado'; persist('estimates', e, true); toast(`Factura ${inv.number} creada desde ${e.number}`); return inv;
  });
}

function onEditInput(e){

  const el = e.target; const o = cur(); if (!o || !el.dataset.k || el.dataset.svc || el.dataset.set || el.dataset.item) return;
  const coll = ctxColl();
  const v = el.value;
  if (el.dataset.list != null){ const arr = o[el.dataset.list] ||= []; arr[+el.dataset.i][el.dataset.k] = v; if (el.dataset.k==='rate' && arr[+el.dataset.i].needsPrice && N(v)){ delete arr[+el.dataset.i].needsPrice; el.classList.remove('needs'); } }
  else o[el.dataset.k] = v;
  persist(coll, o);
  // live recalcs without rebuilding the inputs
  if (coll==='projects') refreshProjCalcs(o);
  if (coll==='estimates'||coll==='invoices') refreshDocTotals(o);
}

function onEditChange(e){
  if (e.currentTarget.id==='view' && (S.view!=='doc' || S.drawer)) return;
  const el = e.target; const o = cur(); if (!o || !el.dataset.k || el.dataset.svc || el.dataset.set || el.dataset.item) return;
  const dc = ctxColl();
  if (el.tagName==='SELECT' || el.type==='date'){ if (el.dataset.list!=null){ const r=(o[el.dataset.list]||[])[+el.dataset.i]; if (r) r[el.dataset.k]=el.value; } else o[el.dataset.k]=el.value; }
  if (el.dataset.list==='plan' && el.dataset.k==='kind'){ persist(dc, o); return renderDrawer(); }
  if ((dc==='estimates'||dc==='invoices') && el.dataset.list==null){
    if (el.dataset.k==='clientId'){
      if (el.value==='__new'){ o.clientId=''; persist(dc,o,true); renderDrawer(); quickClientModal(dc, o.id); return; }
      if (!el.value) {}
      const c = S.clients[o.clientId]; if (c && !o.property) o.property = jobAddr(c);
    }
    if (dc==='invoices' && (el.dataset.k==='terms' || el.dataset.k==='date') && (o.terms??'')!=='custom') o.due = addDays(o.date||todayISO(), N(o.terms));
    if (dc==='invoices' && el.dataset.k==='due'){ o.terms = 'custom'; }
  }
  if ((dc==='estimates'||dc==='invoices') && el.dataset.list==='items' && el.dataset.k==='desc'){
    const r = o.items[+el.dataset.i]; const it = list('items').find(x=>(x.name||'').toLowerCase()===String(el.value).trim().toLowerCase());
    if (r && it){ r.desc = it.desc || it.name; if (!N(r.rate)) r.rate = it.price; if (!r.area && it.area) r.area = it.area; persist(dc,o,true); renderDrawer(`[data-list="items"][data-i="${el.dataset.i}"][data-k="qty"]`); return; }
  }
  // selects & dates: re-render for dependent bits (status pill, progress)
  if (el.tagName==='SELECT' || el.type==='date'){
    if (dc==='invoices' && el.dataset.list==='payments') syncInvoicePayments(o);
    persist(dc, o, true); renderDrawer();
  }
  if (dc==='invoices' && el.dataset.list==='payments' && el.dataset.k==='amount'){ syncInvoicePayments(o); persist('invoices', o, true); renderDrawer(); }
  if (dc==='projects' && el.dataset.k==='month') toast('Movido a '+monthLabel(o.month));
}

function syncInvoicePayments(inv){
  const p = S.projects[inv.projectId]; if (!p) return;
  p.payments = (p.payments||[]).filter(x=>x.invoiceId!==inv.id);
  (inv.payments||[]).forEach(x=>{ if (N(x.amount)) p.payments.push({date:x.date, amount:x.amount, note:`${inv.number}${x.method?' · '+x.method:''}`, invoiceId:inv.id}); });
  persist('projects', p, true);
}

// PDF -> {text, images}: typed text is extracted; scanned / handwritten pages are rendered as images
async function parsePdf(blob, maxImgs){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise;
  const out = {text:'', images:[], pages: pdf.numPages};
  for (let i=1; i<=Math.min(pdf.numPages, 15); i++){
    const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
    const t = tc.items.map(x=>x.str + (x.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').trim();
    if (t.length > 60) out.text += `\n--- page ${i} ---\n${t}`;
    else if (out.images.length < maxImgs){
      const v1 = pg.getViewport({scale:1}); const sc = Math.min(2, 1600/Math.max(v1.width, v1.height)); const vp = pg.getViewport({scale: sc});
      const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext: ctx, viewport: vp}).promise;
      out.images.push({blob: await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)), page: i});
    }
  }
  out.text = out.text.slice(0, 40000);
  return out;
}
async function aiGatherDocs(d, st){
  const fs = docFiles(d); if (!fs.length) return {images:[], desc:''};
  let maxImgs = 8; try { const L = await AI.sample.limits?.(); if (L?.images?.maxCount) maxImgs = L.images.maxCount; else if (L && !L.images) maxImgs = 0; } catch(_){}
  const images = []; const parts = [];
  for (const f of fs){
    if (st) st.textContent = `Leyendo ${f.name}…`;
    try {
      const blob = await fileBlob(f);
      if (f.type==='application/pdf'){
        const pp = AI.parsed[f.id] ||= await parsePdf(blob, maxImgs);
        const imgs = pp.images.slice(0, Math.max(0, maxImgs - images.length));
        imgs.forEach(x => { images.push(x.blob); parts.push(`Image ${images.length}: "${f.name}", page ${x.page} (scanned page)`); });
        if (pp.text) parts.push(`Text extracted from PDF "${f.name}" (${pp.pages} pages):${pp.text}`);
      } else if (images.length < maxImgs){ images.push(blob); parts.push(`Image ${images.length}: "${f.name}"`); }
      else parts.push(`("${f.name}" could not be included: too many images)`);
    } catch(e){ parts.push(`("${f.name}" could not be read)`); }
  }
  return {images, desc: parts.join('\n\n')};
}

  if (!request && !answers.trim() && !docFiles(D.draft).length){ if (st) st.textContent = 'Escribe o dicta lo que quieres.'; inp?.focus(); return; }

    inputSchema:{type:'object', properties:{query:{type:'string', description:'Short English keywords, e.g. "paint interior walls"'}}, required:['query']},

    const missing = (d.items||[]).filter(r=>r.needsPrice).length;

    if (D.aiQ) setTimeout(()=>$('.aiqs')?.scrollIntoView({behavior:'smooth', block:'center'}), 50);

      images_unavailable:'Para leer fotos, recarga Kuadra y permite que envíe imágenes a Claude cuando te lo pregunte.', image_rejected:'Una de las fotos no se pudo leer. Prueba con otra foto (JPG o PNG).', invalid_json:'No pude entender la respuesta. Intenta de nuevo con otras palabras.', prompt_too_large:'El texto es muy largo. Divídelo en partes.', refused:'Claude no pudo procesar esta solicitud.',
      session_expired:'Tu sesión de Claude expiró. Recarga la página.', sampling_disabled:'La IA está desactivada en tu cuenta u organización.', empty_completion:'No hubo respuesta. Intenta de nuevo.'}[e?.code];

function aiApply(d, coll, r){
  const isInv = coll==='invoices';
  if (r.client){
    const want = normKey(r.client); const cs = list('clients');
    const lev = (a,b) => { const m=a.length, n=b.length; if (Math.abs(m-n)>3) return 9; let prev=Array.from({length:n+1},(_,j)=>j); for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; };
    const c = cs.find(x=>normKey(x.name)===want) || cs.find(x=>want && (normKey(x.name).includes(want) || want.includes(normKey(x.name))) && normKey(x.name).length>2)
      || cs.map(x=>[lev(normKey(x.name), want), x]).filter(([dd,x])=>dd <= (want.length>8?2:1)).sort((a,b)=>a[0]-b[0])[0]?.[1];
    if (c){ d.clientId = c.id; if (!d.property) d.property = jobAddr(c); }
    else if (!d.clientId){ toast(`No encontré a "${r.client}" en tus clientes. Elígelo o créalo en "Agregar cliente".`); }
  }
  if (r.property) d.property = String(r.property);
  if (r.summary) d.summary = String(r.summary);
  if (Array.isArray(r.items) && r.items.length){
    d.items = r.items.filter(x=>x && String(x.desc||'').trim()).map(x=>{ const has = x.rate!==null && x.rate!==undefined && x.rate!=='' && isFinite(Number(x.rate));
      return {area:String(x.area||''), desc:String(x.desc).trim(), qty: N(x.qty)||1, rate: has ? Math.round(Number(x.rate)*100)/100 : '', ...(has?{}:{needsPrice:'1'})}; });
    if (d.items.some(x=>x.area)) d.showArea = '1';
  }
  if (!isInv && r.markupPercent !== null && r.markupPercent !== undefined){ if (N(r.markupPercent) > 0){ d.useMarkup = '1'; d.markup = N(r.markupPercent); } else d.useMarkup = ''; }
  if (r.discount && N(r.discount.value) > 0){ d.showDisc = '1'; d.discType = r.discount.type==='%' ? '%' : '$'; d.discount = N(r.discount.value); d.discLabel = String(r.discount.label||''); }
  else if (r.discount && N(r.discount.value) === 0){ d.showDisc = ''; d.discount = ''; }
  if (r.taxPercent !== null && r.taxPercent !== undefined){ d.taxRate = N(r.taxPercent); d.showTax = N(r.taxPercent) ? '1' : ''; }
  if (!isInv && r.depositPercent !== null && r.depositPercent !== undefined){ if (N(r.depositPercent) > 0){ d.showDep = '1'; d.depType = '%'; d.deposit = N(r.depositPercent); } else { d.showDep = ''; d.deposit = ''; } }
  if (isInv && N(r.dueInDays) > 0){ d.terms = String(N(r.dueInDays)); d.due = addDays(d.date||todayISO(), N(r.dueInDays)); }
  if (r.notes) d.notes = String(r.notes);
  const lp = {total:'Solo el total', price:'Precio por línea', all:'Cantidad, precio y monto'}[r.showLinePrices];
  if (lp) applyColsAnswer(d, lp);
}

async function saveDoc(){
  const D = S.doc; if (!D || D.mode!=='edit') return null;
  const d = D.draft;
  if (!d.clientId){ toast('Agrega un cliente antes de guardar'); return null; }
  if (D.isNew) await nextNumber(D.coll==='invoices'?'inv':'est');
  const saved = structuredClone(d);
  learnItems(saved);
  S.doc = {coll:D.coll, id:saved.id, mode:'view'};
  persist(D.coll, saved, true);
  if (D.coll==='invoices') syncInvoicePayments(saved);
  toast(`${D.coll==='invoices'?'Factura':'Estimado'} ${saved.number} guardado`);
  render(); renderDocNow(); window.scrollTo(0,0);
  return saved;
}

                     : [['active','Activos',d=>!['Convertido','Vencido','Rechazado'].includes(st(d))],['draft','Borradores',d=>st(d)==='Borrador'],['all','Todos',()=>true]];
  const key = isInv ? 'invTab' : 'estTab';

/* ---------- Payment links ---------- */
function payLinks(inv){
  const st = S.settings; const bal = Math.max(0, docTotals(inv).balance); const amt = bal.toFixed(2);
  const out = [];
  const own = (inv.payLink||'').trim();
  // Commas (formerly FanBasis) is the main processor; any pasted link that isn't Stripe or Whop is treated as Commas
  const host = u => /whop\.com/i.test(u) ? 'Whop' : /stripe\.com/i.test(u) ? 'card or bank (Stripe)' : 'card (Commas)';
  if (own) out.push({label: host(own), url: own});
  const stripe = (st.stripeLink||'').trim(), whop = (st.whopLink||'').trim(), commas = (st.fanbasisLink||'').trim();
  const ownHost = own ? host(own) : '';
  if (commas && ownHost!=='card (Commas)') out.push({label:'card (Commas)', url:commas});
  if (stripe && ownHost!=='card or bank (Stripe)') out.push({label:'card or bank (Stripe)', url:stripe});
  if (whop && ownHost!=='Whop') out.push({label:'Whop', url:whop});
  const pp = (st.paypalMe||'').trim().replace(/^.*paypal\.me\//i,'').replace(/\/.*$/,'');
  if (pp) out.push({label:'PayPal', url:`https://paypal.me/${encodeURIComponent(pp)}/${amt}USD`});
  const ca = (st.cashtag||'').trim().replace(/^\$/,'');
  if (ca) out.push({label:'Cash App', url:`https://cash.app/$${encodeURIComponent(ca)}/${amt}`});
  const vm = (st.venmo||'').trim().replace(/^@/,'');
  if (vm) out.push({label:'Venmo', url:`https://venmo.com/u/${encodeURIComponent(vm)}`});
  if ((st.zelle||'').trim()) out.push({label:'Zelle', text:`Zelle: send ${money(bal)} to ${st.zelle.trim()}`});
  if ((st.checkPayable||'').trim()) out.push({label:'Cheque', text:`Checks payable to ${st.checkPayable.trim()}`});
  let first = true; out.forEach(l => { if (l.url){ l.btn = first ? 'Pay Now' : 'Pay with '+l.label; first = false; } });
  return out;
}

  return { kind:'estimate', estimateId:d.id, number:d.number, date:d.date||'', validUntil:d.validUntil||'',
    business:{ tradeName:st.tradeName||'', legalName:st.legalName||'', ownerName:st.ownerName||'', phone:st.phone||'', email:st.email||'', address:st.address||'', license:st.license||'' },
    client:{ name:cl.name||'', address:fullAddr(cl).replace(/<[^>]+>/g,' ').trim() }, property:d.property||'', summary:d.summary||'',
    cols, groups: areasOf(d).map(g=>({area:g.area, items:g.items.map(r=>({desc:r.desc, qty:N(r.qty||1), price: cols.price?money(N(r.rate)*f):'', amount: cols.amount?money(N(r.qty||1)*N(r.rate)*f):''}))})),
    lines, total: money(t.total), totalNumber: t.total,
    plan: pr.rows.map((r,i)=>({label:r.label||`Payment ${i+1}`, when:r.when||'', pct:r.kind==='%'?N(r.value):null, amount:money(r.amount)})),
    notes:d.notes||'', contract: contractText(d), updatedAt:new Date().toISOString() };
}
async function ensureShare(d){
  if (!window.claude?.standalone || !S.db) return '';
  if (!d.shareToken){ const a = new Uint8Array(20); crypto.getRandomValues(a); d.shareToken = [...a].map(x=>x.toString(16).padStart(2,'0')).join(''); persist('estimates', d, true); }
  await S.db.collection('shares').doc(d.shareToken).set(JSON.parse(JSON.stringify(shareSnapshot(d))));
  return `${location.origin}/e/${d.shareToken}`;
}

/* ---------- Estimate replies from Gmail ---------- */
const REPLY_LBL = {accepted:['Aceptó el estimado','ok'], question:['Hizo una pregunta','warn'], changes:['Pidió cambios','warn'], reply:['Respondió','info']};
let replyUnsub = null;
function watchReplies(){
  if (replyUnsub || !S.mcp || !S.loaded.estimates || !list('estimates').some(e=>e.sentAt)) return;
  const query = '-from:me newer_than:180d subject:Estimate';
  replyUnsub = S.mcp.watchTool('Gmail','search_threads',{query, pageSize:30, view:'THREAD_VIEW_SUMMARY'}, ev => {
    if (ev.type==='error') return; processReplies(ev.result?.payload?.threads || []);
  }, {cache:{staleTime:60000, gcTime:600000}, refetchInterval:180000});
}
function processReplies(threads){
  const me = String(S.settings.email||'').toLowerCase(); const ests = list('estimates'); const changed = new Set(); const news = [];
  for (const th of threads) for (const m of (th.messages||[])){
    if (!m.sender || m.sender.toLowerCase()===me) continue;
    const subj = decodeEntities(m.subject||''); let est = null, type = 'reply', mm;
    if ((mm = subj.match(/^(?:(?:re|fwd?)\s*:\s*)*(Accepted|Question|Changes requested)\s*[-–]\s*Estimate\s+([^\s–]+)/i))){
      type = /^acc/i.test(mm[1]) ? 'accepted' : /^q/i.test(mm[1]) ? 'question' : 'changes';
      est = ests.find(e=>String(e.number).toLowerCase()===mm[2].toLowerCase());
    } else if ((mm = subj.match(/^(?:re\s*:\s*)+Estimate\s*[-–]\s*(.+?)\s*[-–]\s*[^-–]+$/i))){
      const w = normKey(mm[1]);
      est = ests.filter(e=>e.sentAt && normKey(e.property || jobAddr(S.clients[e.clientId]) || '')===w).sort((a,b)=>String(b.sentAt).localeCompare(String(a.sentAt)))[0];
    }
    if (!est) continue;
    const id = m.id || (th.id+'|'+m.date); est.replies = est.replies || [];
    if (est.replies.some(r=>r.id===id)) continue;
    const dt = m.date ? new Date(isNaN(m.date) ? m.date : Number(m.date)) : new Date(); const at = isNaN(dt) ? new Date().toISOString() : dt.toISOString();
    const who = m.addressDisplayNames?.find(a=>a.emailAddress===m.sender)?.displayName || m.sender;
    est.replies.push({id, threadId: th.id, type, at, from: who, email: m.sender, subject: subj, snippet: decodeEntities(m.snippet||'').slice(0,300), unread:'1'});
    if (type==='accepted' && !est.convertedTo && est.status!=='Aceptado'){ est.status = 'Aceptado'; est.acceptedAt = at; est.acceptedBy = who; }
    changed.add(est); news.push([est, type, who]);
  }
  if (!news.length) return;
  changed.forEach(e => persist('estimates', e, true));
  const [e, type, who] = news[news.length-1];
  toast(type==='accepted' ? `${who} aceptó el estimado ${e.number}` : `${who}: ${REPLY_LBL[type][0].toLowerCase()} sobre el estimado ${e.number}`);
  if (S.view==='doc'){ if (S.doc?.mode==='view') renderDocNow(); } else renderView();
}
const unreadReplies = d => (d.replies||[]).filter(r=>r.unread);
function replyPill(d){
  const u = unreadReplies(d).filter(r=>r.type!=='accepted'); if (!u.length) return '';
  const t = u[u.length-1].type; return ` <span class="pill warn" title="${esc(REPLY_LBL[t][0])}">${t==='changes'?'Cambios':t==='question'?'Pregunta':'Respuesta'}</span>`;

/* ---------- Commas: payment links created and tracked automatically (standalone app) ---------- */
async function ensurePayLink(inv, force){
  if (!S.commas) return inv.payLink || '';
  const t = docTotals(inv); const bal = Math.round(t.balance*100)/100;
  if (bal < 0.5) return '';
  const auto = inv.commasId && inv.payLink && inv.payLink === inv.commasUrl;
  if (!force && inv.payLink && (!auto || Math.abs(N(inv.commasAmt) - bal) < 0.005)) return inv.payLink;   // manual link, or auto link still for the right amount
  const cl = S.clients[inv.clientId] || {}; const where = inv.property || jobAddr(cl) || '';
  const r = await S.commas.create({ invoiceId: inv.id, number: inv.number, amount: bal, title: `${S.settings.tradeName} – Invoice ${inv.number}`, description: [cl.name, where].filter(Boolean).join(' · ') });
  inv.payLink = r.url; inv.commasUrl = r.url; inv.commasId = r.id; inv.commasAmt = bal; inv.commasAt = new Date().toISOString();
  persist('invoices', inv, true);
  return r.url;
}
let commasBusy = false;
async function checkCommasPayments(){
  if (!S.commas || commasBusy || !S.loaded.invoices) return; commasBusy = true;
  try {
    for (const inv of list('invoices')){
      if (!inv.commasId || (inv.payments||[]).some(p=>p.commasId===inv.commasId)) continue;
      if (docTotals(inv).balance < 0.005) continue;
      let r; try { r = await S.commas.status(inv.commasId); } catch(_){ continue; }
      if (!r?.paid) continue;
      (inv.payments ||= []).push({date: todayISO(), amount: N(inv.commasAmt), method: 'Tarjeta (Commas) · pago en línea', commasId: inv.commasId});
      syncInvoicePayments(inv); persist('invoices', inv, true);
      toast(`${clientName(inv.clientId)||'El cliente'} pagó ${fmt(inv.commasAmt,1)} de la factura ${inv.number}`);
      if (S.view==='doc') renderDocNow(); else renderView(); render();
    }
  } finally { commasBusy = false; }
}

  const input = { to, subject, body: text };
  input.htmlBody = htmlText;
  if (doc){
    if (!window.jspdf){ msgEl.innerHTML='<div class="note bad">El generador de PDF no cargó. Revisa tu conexión y vuelve a intentar.</div>'; return; }
    const pdf = makePDF(doc, S.composeDoc.coll);
    const isInvMail = S.composeDoc.coll==='invoices';
    let shareUrl = '';
    if (!isInvMail){ try { shareUrl = await ensureShare(doc); } catch(e){ shareUrl = ''; } }
    input.htmlBody = mailLayout(doc, S.composeDoc.coll, text, shareUrl);
    if (isInvMail){ const l = payLinks(doc).find(x=>x.url); if (l && docTotals(doc).balance>0.004) input.body = text + `\n\nPay online (${money(docTotals(doc).balance)}): ${l.url}`; }
    else input.body = text + (shareUrl ? `\n\nReview and ${contractText(doc)?'sign':'accept'} this estimate online: ${shareUrl}` : `\n\nTo accept this estimate, ask a question or request changes, just reply to this email.`);
    input.attachments = [{content: LOGO_PDF, filename:'jc-home-services-logo.jpg', mimeType:'image/jpeg', inline:true}, {content: pdf.base64, filename: pdf.name, mimeType:'application/pdf'}];
  }
  if (S.composeThread && mode==='send') input.replyThreadId = S.composeThread;
  document.querySelectorAll('[data-act="send-mail"]').forEach(b=>b.disabled=true);
  msgEl.innerHTML = `<div class="note">${mode==='send'?'Enviando…':'Guardando borrador…'}</div>`;
  try {
    await S.mcp.callTool('Gmail', mode==='send'?'send_message':'create_draft', input);
    if (doc && mode==='send'){
      doc.sentAt = new Date().toISOString(); doc.sentTo = to.join(', ');
      if (S.composeDoc.coll==='estimates' && (!doc.status || doc.status==='Borrador')) doc.status='Enviado';
      persist(S.composeDoc.coll, doc, true); renderDrawer();
    }
    closeModal(); toast(mode==='send'?'Email enviado':'Borrador guardado en Gmail');
    S.mcp.invalidate?.('Gmail').catch(()=>{});
  } catch(e){
    document.querySelectorAll('[data-act="send-mail"]').forEach(b=>b.disabled=false);
    const ambiguous = ['server_unavailable','upstream_error'].includes(e?.code);
    msgEl.innerHTML = `<div class="note bad">${esc(gmailErr(e))}${ambiguous&&mode==='send'?' Revisa tu carpeta de Enviados antes de reenviar: puede que sí se haya enviado.':''}</div>`;
  }
}

let mailUnsub = null, mailKey = '';
function loadMail(force){
  const box = $('#mailbox'); if (!box || !S.mcp) return;
  const key = S.mailQ;
  if (mailUnsub && mailKey===key && !force && S.mailCache){ box.innerHTML = S.mailCache; return; }
  mailUnsub?.(); mailKey = key;
  const input = {query:key, pageSize:25, view:'THREAD_VIEW_SUMMARY'};
  mailUnsub = S.mcp.watchTool('Gmail','search_threads', input, ev => {
    const b = $('#mailbox'); if (!b) return;
    if (ev.type==='error'){
      const retract = ['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest'].includes(ev.error?.code);
      const html = `<div class="empty"><span>${esc(gmailErr(ev.error))}</span>${ev.error?.code==='approval_required'||ev.error?.code==='not_in_manifest'?`<button class="btn primary" data-act="mail-refresh-call">Permitir Gmail</button>`:''}${window.claude?.standalone && ['server_not_connected','needs_reauth'].includes(ev.error?.code)?`<button class="btn primary" data-act="gmail-connect">Conectar Gmail</button>`:''}</div>`;
      if (retract || !S.mailCache) { b.innerHTML = html; S.mailCache = ''; }
      return;
    }
    const threads = ev.result?.payload?.threads || [];
    const html = threads.length ? threads.map(th=>{
      const m = (th.messages||[])[0]||{};
      const who = m.addressDisplayNames?.find(a=>a.emailAddress===m.sender)?.displayName || m.sender || '';
      const unread = (m.labelIds||[]).includes('UNREAD');
      const d = m.date ? new Date(m.date) : null;
      const when = d ? (d.toDateString()===new Date().toDateString() ? d.toLocaleTimeString('es-US',{hour:'numeric',minute:'2-digit'}) : d.getDate()+' '+MES3[d.getMonth()]) : '';
      return `<div class="thread ${unread?'unread':''}" data-act="open-thread" data-id="${esc(th.id)}" role="button" tabindex="0"><span class="from">${esc(who)}${th.messageCount>1?` <span class="muted">(${th.messageCount})</span>`:''}</span><span class="line"><span class="subj">${esc(decodeEntities(m.subject)||'(sin asunto)')}</span> — ${esc(decodeEntities(m.snippet))}</span><time>${when}</time></div>`;
    }).join('') : `<div class="empty"><span>No hay correos para esta búsqueda.</span></div>`;
    S.mailCache = html; b.innerHTML = html;
  }, {cache:{staleTime:60000, gcTime:600000}, refetchInterval:120000});
}
document.addEventListener('click', async e => {

async function openThread(id){
  openModal('Correo', '<div class="note">Cargando conversación…</div>', '');
  try {
    const r = await S.mcp.callTool('Gmail','get_thread',{threadId:id, messageFormat:'PLAIN_TEXT'});
    const msgs = r.payload?.messages || [];
    const last = msgs[msgs.length-1] || {};
    const subj = decodeEntities(msgs[0]?.subject || '');
    const body = msgs.map(m=>`<div class="msg"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(m.addressDisplayNames?.find(a=>a.emailAddress===m.sender)?.displayName || m.sender || '')}</b><span class="muted" style="font-size:12px">${m.date?new Date(m.date).toLocaleString('es-US'):''}</span></div><pre>${esc(m.plaintextBody || decodeEntities(m.snippet) || '')}</pre></div>`).join('');
    const view = r.payload?.viewUrl;
    openModal(esc(subj||'Correo'), body || '<span class="muted">Sin contenido.</span>',
      `${view?`<a class="btn" href="${esc(view)}" target="_blank" rel="noopener">Abrir en Gmail</a>`:''}<button class="btn primary" data-act="reply" data-to="${esc(last.sender||'')}" data-subj="${esc(subj.startsWith('Re:')?subj:'Re: '+subj)}" data-thread="${esc(id)}">Responder</button>`);
  } catch(e){ openModal('Correo', `<div class="note bad">${esc(gmailErr(e))}</div>`, ''); }
}
